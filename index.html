<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>雾林夜逃 · 第一人称像素探索</title>
<style>
  :root{
    --ink:#06080b;
    --panel:rgba(11,15,20,.84);
    --line:rgba(197,171,117,.24);
    --line-2:rgba(197,171,117,.45);
    --gold:#c9aa72;
    --gold-bright:#f0d9a6;
    --blood:#a8342f;
    --blood-bright:#e2564e;
    --text:#e7e0d2;
    --muted:#98a1aa;
    --accent:#c8b48c;
    --serif:"Noto Serif SC","Songti SC","SimSun",Georgia,"Times New Roman",serif;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    background:#04060a;
    color:var(--text);
    font-family:var(--sans);
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
  }
  #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100%;height:100%;overflow:hidden;background:#04060a;}
  canvas#game{display:block;width:100%;height:100%;touch-action:none;}

  /* ---------- HUD ---------- */
  #hud{position:absolute;inset:0;pointer-events:none;}
  #hud.hidden{display:none;}

  /* 危险红边 */
  #danger{
    position:absolute;inset:0;pointer-events:none;opacity:0;
    background:
      radial-gradient(120% 90% at 50% 50%,rgba(0,0,0,0) 42%,rgba(150,20,18,0.30) 78%,rgba(190,26,22,0.62) 100%);
    transition:opacity .25s ease;
    mix-blend-mode:normal;
  }

  .topbar{
    position:absolute;top:14px;left:16px;right:16px;
    display:flex;gap:12px;align-items:flex-start;justify-content:space-between;
  }
  .panel{
    position:relative;
    background:linear-gradient(180deg,rgba(16,21,27,.88),rgba(8,11,15,.9));
    border:1px solid var(--line);
    border-radius:10px;
    backdrop-filter:blur(10px) saturate(120%);
    -webkit-backdrop-filter:blur(10px) saturate(120%);
    box-shadow:0 10px 30px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.045);
  }
  .panel::after{
    content:"";position:absolute;inset:0;border-radius:10px;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 2px);
    opacity:.6;
  }
  .side{display:flex;align-items:center;gap:11px;padding:9px 15px;}
  .avatar{
    position:relative;width:34px;height:34px;border-radius:50%;flex:none;
    border:1px solid rgba(197,171,117,.4);
    background:
      radial-gradient(circle at 50% 40%,rgba(240,225,196,.92) 0 22%,rgba(190,170,130,.18) 23%,transparent 25%),
      radial-gradient(circle at 50% 78%,rgba(225,215,195,.7) 0 26%,transparent 27%),
      linear-gradient(160deg,#2a353f,#10151b);
    box-shadow:inset 0 0 14px rgba(0,0,0,.75),0 0 12px rgba(201,170,114,.14);
  }
  .who{display:flex;flex-direction:column;gap:5px;min-width:0;}
  #charName{
    font-family:var(--serif);font-size:12.5px;letter-spacing:.05em;
    color:var(--gold-bright);white-space:nowrap;
    text-shadow:0 1px 3px rgba(0,0,0,.8);
  }
  #hearts{display:flex;gap:3px;align-items:center;filter:drop-shadow(0 0 5px rgba(184,53,47,.4));}

  .center{
    display:flex;flex-direction:column;align-items:center;gap:7px;
    padding:9px 20px;min-width:238px;
  }
  .cipher-row{display:flex;align-items:center;gap:9px;}
  .cipher-label{
    font-family:var(--serif);font-size:10px;letter-spacing:.2em;
    color:rgba(197,171,117,.72);
  }
  #cipherPills{display:flex;gap:5px;}
  #cipherPills .pill{
    width:21px;height:6px;border-radius:99px;
    background:rgba(110,140,180,.18);
    box-shadow:inset 0 0 0 1px rgba(110,140,180,.22);
    transition:background .3s,box-shadow .3s;
  }
  #cipherPills .pill.on{
    background:linear-gradient(90deg,#f6dfae,#c39b4f);
    box-shadow:0 0 11px rgba(246,223,174,.65),inset 0 0 0 1px rgba(255,244,214,.7);
  }
  .cipher-num{font-family:var(--serif);font-size:12.5px;color:var(--gold);letter-spacing:.06em;}
  .cipher-num b{color:var(--gold-bright);font-weight:600;}
  #objective{
    font-size:10.5px;color:#b6bfc7;letter-spacing:.04em;text-align:center;
    max-width:310px;line-height:1.4;
  }

  .right-col{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  .timer-panel{display:flex;align-items:center;gap:10px;padding:8px 13px;}
  #timer{
    font-family:var(--serif);font-size:15px;letter-spacing:.1em;
    color:var(--text);font-variant-numeric:tabular-nums;
    text-shadow:0 0 12px rgba(240,217,166,.22);
  }
  #pauseBtn{
    pointer-events:auto;width:29px;height:29px;border-radius:8px;flex:none;
    background:rgba(255,255,255,.045);border:1px solid var(--line);
    color:var(--gold);cursor:pointer;display:grid;place-items:center;
    transition:background .18s,border-color .18s,transform .18s;
  }
  #pauseBtn:hover{background:rgba(201,170,114,.16);border-color:var(--line-2);transform:translateY(-1px);}
  #pauseBtn svg{width:12px;height:12px;}

  .stamina-wrap{width:148px;}
  .stamina-label{
    font-family:var(--serif);font-size:9px;letter-spacing:.18em;
    color:rgba(152,161,170,.85);margin-bottom:4px;text-align:right;
  }
  .stamina-track{
    position:relative;height:5px;border-radius:99px;overflow:hidden;
    background:rgba(255,255,255,.06);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);
  }
  #staminaFill{
    height:100%;width:100%;border-radius:99px;
    background:linear-gradient(90deg,#6db695,#c6e8cf);
    box-shadow:0 0 10px rgba(150,220,190,.4);
    transition:width .1s linear,background .3s;
  }
  #staminaFill.low{background:linear-gradient(90deg,#a83f38,#e08a74);box-shadow:0 0 10px rgba(224,100,80,.45);}

  /* 队友状态栏 */
  #mateRow{
    position:absolute;left:22px;top:96px;
    display:flex;flex-direction:column;gap:6px;
    pointer-events:none;
  }
  #mateRow .mate{
    display:flex;align-items:center;gap:7px;
    padding:5px 11px 5px 9px;border-radius:99px;
    background:rgba(9,13,17,.62);
    border:1px solid rgba(140,168,196,.20);
    backdrop-filter:blur(5px);
    font-size:10.5px;letter-spacing:.04em;
    transition:border-color .3s,background .3s,opacity .3s;
  }
  #mateRow .mate::before{
    content:'';width:5px;height:5px;border-radius:50%;
    background:#7fd6a4;box-shadow:0 0 7px rgba(127,214,164,.85);
    flex:0 0 auto;
  }
  #mateRow .mname{
    color:#e6dfd0;font-family:var(--serif);font-size:11px;letter-spacing:.05em;
  }
  #mateRow .mstat{
    color:rgba(150,162,176,.9);font-size:9.5px;letter-spacing:.10em;
  }
  #mateRow .mate.down{
    border-color:rgba(224,86,72,.55);
    background:rgba(38,12,12,.72);
    animation:matePulse 1.15s ease-in-out infinite;
  }
  #mateRow .mate.down::before{background:#e8624c;box-shadow:0 0 9px rgba(232,98,76,.9);}
  #mateRow .mate.down .mstat{color:#ff9c8c;}
  #mateRow .mate.dead{opacity:.42;border-color:rgba(120,120,120,.2);}
  #mateRow .mate.dead::before{background:#6a6a6a;box-shadow:none;}
  #mateRow .mate.dead .mname{color:#9a968e;text-decoration:line-through;}
  #mateRow .mbar{
    display:block;width:38px;height:3px;border-radius:99px;
    background:rgba(255,255,255,.13);overflow:hidden;flex:0 0 auto;
  }
  #mateRow .mbar b{
    display:block;height:100%;border-radius:99px;
    background:linear-gradient(90deg,#c85a46,#f0b58a);
    transition:width .12s linear;
  }
  @keyframes matePulse{
    0%,100%{box-shadow:0 0 0 0 rgba(224,86,72,.0);}
    50%{box-shadow:0 0 12px 1px rgba(224,86,72,.32);}
  }
  body.touch #mateRow{top:88px;left:14px;transform:scale(.94);transform-origin:left top;}

  #prompt{
    position:absolute;left:50%;bottom:98px;transform:translate(-50%,10px);
    padding:9px 20px;border-radius:99px;
    background:rgba(9,13,17,.88);
    border:1px solid rgba(201,170,114,.32);
    font-size:12.5px;letter-spacing:.04em;color:var(--gold-bright);
    opacity:0;transition:opacity .18s,transform .18s;
    white-space:nowrap;
    box-shadow:0 12px 30px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);
    backdrop-filter:blur(6px);
  }
  #prompt.show{opacity:1;transform:translate(-50%,0);}

  #toast{
    position:absolute;left:50%;top:98px;transform:translate(-50%,-8px);
    padding:10px 20px 10px 22px;border-radius:8px;
    background:rgba(12,16,21,.9);
    border:1px solid rgba(201,170,114,.26);
    border-left:2px solid var(--gold);
    font-size:12.5px;color:#e6ddc9;letter-spacing:.02em;
    opacity:0;transition:opacity .25s,transform .25s;
    max-width:min(560px,88vw);text-align:center;line-height:1.55;
    box-shadow:0 14px 34px rgba(0,0,0,.6);
    backdrop-filter:blur(6px);
  }
  #toast.show{opacity:1;transform:translate(-50%,0);}

  /* 第一视角：键盘操作提示 */
  #lookHint{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);
    padding:9px 18px;border-radius:99px;
    background:rgba(8,11,15,.82);
    border:1px solid rgba(201,170,114,.28);
    font-size:11.5px;letter-spacing:.06em;color:#d8cdb4;
    opacity:0;pointer-events:none;
    transition:opacity .4s ease,transform .4s ease;
    backdrop-filter:blur(6px);
    white-space:nowrap;
  }
  #lookHint.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
  body.touch #lookHint{display:none;}

  /* 校准 */
  #calib{
    position:absolute;left:50%;bottom:152px;transform:translateX(-50%);
    width:min(342px,74vw);display:none;
  }
  #calib.show{display:block;animation:calibIn .2s ease-out;}
  @keyframes calibIn{from{opacity:0;transform:translateX(-50%) translateY(10px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
  .calib-head{
    display:flex;justify-content:space-between;align-items:center;
    font-family:var(--serif);font-size:10px;letter-spacing:.18em;
    color:rgba(231,224,210,.68);margin-bottom:6px;
  }
  .calib-head b{
    color:#14181d;background:linear-gradient(180deg,#f2dcae,#c9a25c);
    font-weight:600;font-size:9.5px;padding:2px 7px;border-radius:4px;letter-spacing:.1em;
  }
  .calib-track{
    position:relative;height:15px;border-radius:99px;overflow:hidden;
    background:linear-gradient(90deg,rgba(48,58,70,.9),rgba(22,29,36,.96));
    border:1px solid rgba(201,170,114,.3);
    box-shadow:inset 0 2px 9px rgba(0,0,0,.7),0 0 22px rgba(0,0,0,.4);
  }
  #calibBand{
    position:absolute;top:0;bottom:0;
    background:linear-gradient(180deg,rgba(255,236,182,.96),rgba(206,170,102,.82));
    box-shadow:0 0 18px rgba(255,224,150,.8);
    border-left:1px solid rgba(255,255,255,.8);
    border-right:1px solid rgba(255,255,255,.8);
  }
  #calibNeedle{
    position:absolute;top:-4px;bottom:-4px;width:3px;
    background:#f8f3e6;border-radius:2px;transform:translateX(-50%);
    box-shadow:0 0 10px rgba(255,255,255,.95),0 0 20px rgba(255,208,138,.8);
  }
  .calib-hint{
    text-align:center;font-size:10px;color:rgba(231,224,210,.55);
    margin-top:6px;letter-spacing:.08em;
  }

  /* ---------- 覆盖层 ---------- */
  #overlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 100% at 50% 0%,rgba(6,9,13,.62),rgba(3,5,8,.86));
    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
    padding:18px;overflow:auto;z-index:20;
  }
  #overlay.hidden{display:none;}
  #sheet{width:100%;max-width:880px;}

  .start{
    position:relative;overflow:hidden;
    background:linear-gradient(180deg,rgba(17,22,28,.96),rgba(8,11,15,.98));
    border:1px solid var(--line);
    border-radius:14px;
    padding:28px 32px 24px;
    box-shadow:0 30px 80px rgba(0,0,0,.78),inset 0 1px 0 rgba(255,255,255,.05);
  }
  .start::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(72% 44% at 50% -10%,rgba(201,170,114,.16),transparent 72%),
      repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px);
  }
  .start::after{
    content:"";position:absolute;left:0;right:0;top:0;height:1px;pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(240,217,166,.55),transparent);
  }
  .brand{text-align:center;position:relative;}
  .eyebrow{
    font-family:var(--serif);font-size:9.5px;letter-spacing:.32em;
    color:rgba(201,170,114,.6);text-transform:uppercase;
  }
  .brand h1{
    font-family:var(--serif);
    font-size:clamp(32px,5.4vw,48px);
    letter-spacing:.22em;margin:10px 0 6px;padding-left:.22em;
    font-weight:600;color:#f6efdd;
    text-shadow:0 0 34px rgba(201,170,114,.36),0 4px 0 rgba(0,0,0,.55);
  }
  .rule{display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 0 10px;}
  .rule span{
    display:block;height:1px;width:min(110px,22vw);
    background:linear-gradient(90deg,transparent,rgba(201,170,114,.55));
  }
  .rule span:last-child{background:linear-gradient(270deg,transparent,rgba(201,170,114,.55));}
  .rule i{
    display:block;width:5px;height:5px;transform:rotate(45deg);
    background:rgba(240,217,166,.75);box-shadow:0 0 10px rgba(240,217,166,.6);
  }
  .lede{
    font-size:12.5px;line-height:1.9;color:#a6afb7;
    max-width:486px;margin:0 auto;letter-spacing:.02em;
  }
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin:24px 0 22px;position:relative;}
  .col-title{
    font-family:var(--serif);font-size:10px;letter-spacing:.24em;
    color:rgba(201,170,114,.72);margin-bottom:10px;
    padding-left:9px;position:relative;
  }
  .col-title::before{
    content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
    width:3px;height:10px;border-radius:2px;
    background:linear-gradient(180deg,#f0d9a6,#a8813f);
  }
  .side-row{
    display:flex;gap:0;justify-content:center;margin:16px auto 14px;
    width:270px;border:1px solid rgba(201,170,114,.26);border-radius:9px;
    overflow:hidden;background:rgba(255,255,255,.022);
  }
  .side{
    flex:1;cursor:pointer;font-family:var(--serif);font-size:12.5px;
    letter-spacing:.16em;padding:9px 0;color:#98a1a9;
    background:transparent;border:0;transition:all .2s;
  }
  .side:hover{color:#e6dbc4;background:rgba(201,170,114,.07);}
  .side.selected{
    color:#151a20;background:linear-gradient(180deg,#f2dcae,#c49c56);
    font-weight:600;box-shadow:inset 0 0 18px rgba(255,240,205,.35);
  }
  .char-list{display:flex;flex-direction:column;gap:7px;}
  .char-card{
    position:relative;display:block;width:100%;text-align:left;cursor:pointer;
    background:rgba(255,255,255,.026);
    border:1px solid rgba(255,255,255,.07);
    border-radius:9px;padding:9px 13px;
    color:var(--text);font-family:inherit;
    transition:border-color .18s,background .18s,box-shadow .18s;
  }
  .char-card:hover{background:rgba(201,170,114,.075);border-color:rgba(201,170,114,.32);}
  .char-card.selected{
    background:linear-gradient(90deg,rgba(201,170,114,.16),rgba(201,170,114,.02));
    border-color:rgba(240,217,166,.55);
    box-shadow:0 0 0 1px rgba(240,217,166,.14),0 8px 22px rgba(0,0,0,.42);
  }
  .char-card.selected::after{
    content:"";position:absolute;left:0;top:9px;bottom:9px;width:2px;border-radius:2px;
    background:linear-gradient(180deg,#f8e8bd,#c19a52);
    box-shadow:0 0 10px rgba(240,217,166,.6);
  }
  .char-tag{
    display:inline-block;font-family:var(--serif);font-size:9px;
    letter-spacing:.16em;color:var(--gold);
    border:1px solid rgba(201,170,114,.28);border-radius:4px;
    padding:1px 5px;margin-bottom:4px;
  }
  .char-name{display:block;font-family:var(--serif);font-size:13px;letter-spacing:.045em;color:#f2ebdb;}
  .char-perk{display:block;font-size:10.5px;color:#8c959d;margin-top:3px;line-height:1.55;}
  .diff-row{display:flex;gap:7px;}
  .diff{
    flex:1;cursor:pointer;font-family:var(--serif);font-size:12px;letter-spacing:.08em;
    color:#a4adb5;background:rgba(255,255,255,.028);
    border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:8px 0;
    transition:all .18s;
  }
  .diff:hover{border-color:rgba(201,170,114,.38);color:#e2d6bb;}
  .diff.selected{
    color:#151a20;background:linear-gradient(180deg,#f2dcae,#c49c56);
    border-color:#f2dcae;font-weight:600;
    box-shadow:0 5px 16px rgba(201,170,114,.3);
  }
  .howto{list-style:none;padding:0;margin:0;font-size:11.5px;line-height:2;color:#a2abb3;}
  .howto li{position:relative;padding-left:15px;}
  .howto li::before{
    content:"";position:absolute;left:3px;top:9px;
    width:4px;height:4px;transform:rotate(45deg);
    background:rgba(201,170,114,.6);
  }
  .howto b{color:#eadfc6;font-weight:600;}
  .note{
    margin-top:13px;padding:10px 12px;border-radius:7px;
    background:linear-gradient(90deg,rgba(168,52,47,.13),rgba(168,52,47,.03));
    border-left:2px solid rgba(226,86,78,.55);
    font-size:10.5px;color:#b6a4a2;line-height:1.75;
    font-style:italic;
  }
  .primary{
    position:relative;display:block;width:100%;cursor:pointer;
    font-family:var(--serif);font-size:14px;letter-spacing:.3em;
    padding:13px 0 13px .3em;color:#11151a;
    background:linear-gradient(180deg,#f6e2b6,#c9a05b);
    border:none;border-radius:9px;font-weight:600;
    box-shadow:0 12px 30px rgba(201,162,92,.26),inset 0 1px 0 rgba(255,255,255,.65);
    transition:transform .16s,box-shadow .16s,filter .16s;
  }
  .primary:hover{transform:translateY(-1px);filter:brightness(1.06);box-shadow:0 16px 36px rgba(201,162,92,.34),inset 0 1px 0 rgba(255,255,255,.75);}
  .primary:active{transform:translateY(0);filter:brightness(.98);}
  .ghost{
    cursor:pointer;font-family:var(--serif);font-size:12.5px;letter-spacing:.14em;
    padding:12px 20px;border-radius:9px;background:transparent;color:#c4ccd4;
    border:1px solid rgba(255,255,255,.14);transition:all .18s;
  }
  .ghost:hover{border-color:rgba(201,170,114,.5);color:#f0d9a6;background:rgba(201,170,114,.06);}

  .modal{
    position:relative;max-width:452px;margin:0 auto;padding:32px 28px;text-align:center;
    background:linear-gradient(180deg,rgba(17,22,28,.97),rgba(8,11,15,.985));
    border:1px solid var(--line);border-radius:14px;
    box-shadow:0 30px 80px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.05);
  }
  .modal h2{
    font-family:var(--serif);font-size:20px;letter-spacing:.2em;
    color:#f6efdd;margin:0 0 8px;padding-left:.2em;font-weight:600;
  }
  .muted{font-size:12px;color:#8b949c;line-height:1.85;margin:0 0 20px;letter-spacing:.02em;}
  .row-btns{display:flex;gap:10px;justify-content:center;margin-top:6px;}
  .row-btns .primary{width:auto;flex:1;padding:12px 22px;letter-spacing:.18em;}
  .result .verdict{
    font-family:var(--serif);font-size:26px;letter-spacing:.26em;
    padding-left:.26em;margin-bottom:10px;
  }
  .result.win .verdict{color:#f0d9a6;text-shadow:0 0 36px rgba(240,217,166,.5);}
  .result.lose .verdict{color:#e07b73;text-shadow:0 0 36px rgba(226,86,78,.45);}
  .stats{
    display:grid;grid-template-columns:1fr 1fr;gap:1px;margin:18px 0 20px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.06);border-radius:9px;overflow:hidden;
  }
  .stats div{background:rgba(11,15,20,.96);padding:12px 8px;display:flex;flex-direction:column;gap:5px;}
  .stats span{font-family:var(--serif);font-size:9.5px;letter-spacing:.16em;color:#7d868e;}
  .stats b{font-family:var(--serif);font-size:15px;color:#efe6d3;font-weight:600;letter-spacing:.04em;}

<script>
/* ==========================================================
   雾林夜逃 · MANOR NIGHT  —— 第一视角 (First Person)
   软件光线投射渲染 + 提灯光锥 + 距离雾 + 精灵投影
   ========================================================== */
(function () {
  'use strict';

  /* ---------------- 常量 ---------------- */
  var TILE = 40, COLS = 56, ROWS = 40;
  var WORLD_W = TILE * COLS, WORLD_H = TILE * ROWS;
  var TAU = Math.PI * 2;
  var WALL_H = 1.62, EYE_H = 0.68;      // 以「格」为单位
  var FOV_H = 1.32;
  var PLANE_K = Math.tan(FOV_H / 2);
  var FOG_R = 38, FOG_G = 53, FOG_B = 56;
  var FOREST_SIGHT = TILE; // One world tile represents one metre.
  // Fine details disappear first; nearby terrain and tree silhouettes remain readable.
  function forestVisibility(distance) {
    var range = TILE * (lanternVisible() ? 4.8 : 1.65);
    var t=clamp((range-distance)/(range-TILE*1.1),0,1);
    return t*t*(3-2*t);
  }
  function forestSpriteVisibility(sprite) {
    var distance=dist(player.x,player.y,sprite.x,sprite.y);
    if(sprite.img===SPR.forestTree || sprite.tree){
      var surface=Math.max(0,distance-TILE*.55);
      return Math.max(forestVisibility(surface), .72*clamp(1-surface/(TILE*7),0,1),fixedLightAt(sprite.x,sprite.y)*.9*clamp(1-surface/(TILE*9),0,1));
    }
    return Math.max(forestVisibility(distance),fixedLightAt(sprite.x,sprite.y)*clamp(1-distance/(TILE*9),0,1));
  }
  var forestTrail=new Uint8Array(COLS*ROWS), trailTexture, forestPlaces=[];
  function onForestTrail(x,y) {
    return forestTrail[Math.floor(y/TILE)*COLS+Math.floor(x/TILE)]>0;
  }
  var forestLinks=[],forestSecrets=[],forestGate=null,hiddenTrailTexture;
  function buildForestTrails(){
    forestTrail=new Uint8Array(COLS*ROWS);forestLinks=[];forestSecrets=[];
    var centers=rooms.map(roomCenter),reached=[0],remaining=[1,2,3,4,5,6,7,8];
    function paint(px,py,radius,type){
      for(var y=Math.max(1,Math.floor(py-radius));y<=Math.min(ROWS-2,Math.ceil(py+radius));y++)for(var x=Math.max(1,Math.floor(px-radius));x<=Math.min(COLS-2,Math.ceil(px+radius));x++){
        if(Math.hypot(x+.5-px,y+.5-py)>radius)continue;
        var k=y*COLS+x;if(type===1||forestTrail[k]===0)forestTrail[k]=type;
      }
    }
    function curve(a,b,type){
      var dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len;
      var bend1=rand(-1,1)*Math.min(5,len*.35),bend2=rand(-1,1)*Math.min(5,len*.35),steps=Math.ceil(len*8);
      var c1={x:clamp(a.x+dx*.32+nx*bend1,2, COLS-2),y:clamp(a.y+dy*.32+ny*bend1,2,ROWS-2)};
      var c2={x:clamp(a.x+dx*.68+nx*bend2,2,COLS-2),y:clamp(a.y+dy*.68+ny*bend2,2,ROWS-2)};
      var previous=null,phase=rand(0,TAU);
      for(var i=0;i<=steps;i++){
        var t=i/steps,u=1-t,x=u*u*u*a.x+3*u*u*t*c1.x+3*u*t*t*c2.x+t*t*t*b.x,y=u*u*u*a.y+3*u*u*t*c1.y+3*u*t*t*c2.y+t*t*t*b.y;
        var radius=type===2?.74:(.96+.16*Math.sin(t*12+phase));
        paint(x,y,radius,type);
        var cell={x:Math.floor(x),y:Math.floor(y)};
        // Keep narrow diagonal paths traversable by the real four-direction pathfinder.
        if(previous&&cell.x!==previous.x&&cell.y!==previous.y){var k=previous.y*COLS+cell.x;if(type===1||!forestTrail[k])forestTrail[k]=type;}
        previous=cell;
      }
    }
    function add(a,b,type){forestLinks.push({a:a,b:b,hidden:type===2});curve(centers[a],centers[b],type);}
    // A connected, irregular backbone, then a few loops that give chases route choices.
    while(remaining.length){
      var best=null,score=Infinity;
      reached.forEach(function(a){remaining.forEach(function(b){var d=dist(centers[a].x,centers[a].y,centers[b].x,centers[b].y)+rand(0,3);if(d<score){score=d;best={a:a,b:b};}});});
      add(best.a,best.b,1);reached.push(best.b);remaining.splice(remaining.indexOf(best.b),1);
    }
    var pairs=[];
    for(var a=0;a<9;a++)for(var b=a+1;b<9;b++){
      if(forestLinks.some(function(e){return e.a===a&&e.b===b||e.a===b&&e.b===a}))continue;
      pairs.push({a:a,b:b,d:dist(centers[a].x,centers[a].y,centers[b].x,centers[b].y)+rand(0,5)});
    }

  function hunterShape(c, fill, points, outline) {
    c.beginPath();
    c.moveTo(points[0][0], points[0][1]);
    for (var i = 1; i < points.length; i++) c.lineTo(points[i][0], points[i][1]);
    c.closePath();
    c.fillStyle = fill;
    c.fill();
    if (outline) {
      c.strokeStyle = outline;
      c.lineWidth = 1.5;
      c.stroke();
    }
  }

  function hunterOval(c, fill, x, y, rx, ry) {

  // The same weapon silhouette is used on the character and in first person.
  function drawHunterWeapon(c, key) {
    var art = hunterArt[key];

    edge.addColorStop(0, art.metal);

    edge.addColorStop(1, key === 'geisha' ? '#eab39c' : '#c6cdd1');
    if (key === 'butcher') {
      c.fillStyle = '#4e342b'; rr(c, -5, -36, 10, 50, 3); c.fill();
      for (var notch = 0; notch < 4; notch++) {
        c.fillStyle = '#ae8862'; c.fillRect(-5, -15 + notch * 6, 10, 2);
      }
      hunterShape(c, edge, [[-7,-91],[26,-91],[33,-83],[31,-43],[24,-36],[-7,-36]], '#342832');
      hunterOval(c, '#3d383b', 22, -81, 4, 4);
      hunterShape(c, '#f1d4af', [[28,-85],[31,-82],[29,-44],[24,-38],[21,-38],[25,-47]]);
    } else if (key === 'ripper') {
      for (var finger = 0; finger < 4; finger++) {
        var x = -20 + finger * 12, tip = -83 - (finger % 3) * 10;
        hunterShape(c, edge, [[x-4,-20],[x-5,tip+15],[x+4,tip],[x+7,tip+26],[x+4,-18]], '#333b50');
      }
      hunterShape(c, '#576270', [[-25,-23],[23,-24],[17,7],[-18,10]], '#222a3d');
      for (var rivet = -15; rivet <= 15; rivet += 10) hunterOval(c, '#dce0dd', rivet, -16, 2.4, 2.4);
    } else {
      c.fillStyle = edge;
      c.beginPath(); c.moveTo(0, 1);
      c.arc(0, 0, 79, -2.22, -.71);
      c.closePath(); c.fill();
      c.strokeStyle = '#f3d5b3'; c.lineWidth = 2.2; c.stroke();
      for (var rib = 0; rib <= 9; rib++) {
        var a = -2.22 + rib * 1.51 / 9;
        c.strokeStyle = rib % 2 ? '#693743' : '#e9b7a7';
        c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(a) * 78, Math.sin(a) * 78); c.stroke();
      }
      hunterOval(c, '#e1bc77', 0, 0, 4, 4);
    }
  }

  function hunterSwingPose(key, t) {
    var windup = Math.sin(Math.PI * clamp(t / .32, 0, 1));
    var sweep = Math.sin(Math.PI * clamp((t - .23) / .77, 0, 1));
    if (key === 'butcher') return { x:-.19*sweep, y:-.32*windup-.09*sweep, angle:.4-.96*windup+1.42*sweep };
    if (key === 'ripper') return { x:.51*sweep, y:-.25*sweep, angle:-.48-.42*windup+1.75*sweep };
    return { x:-.56*sweep, y:-.19*sweep-.09*windup, angle:.25+.61*windup-1.72*sweep };
  }

  function inBounds(x, y) { return x > 0 && y > 0 && x < COLS - 1 && y < ROWS - 1; }

    for (var j = y; j < y + h; j++) for (var i = x; i < x + w; i++) if (inBounds(i, j)) grid[j * COLS + i] = 1;
  }
  function carveCorridor(ax, ay, bx, by) {
    var hFirst = Math.random() < 0.5, x, y;
    function put(px, py) { carveRect(px, py, 2, 2); }
    if (hFirst) {
      for (x = Math.min(ax, bx); x <= Math.max(ax, bx); x++) put(x, ay);
      for (y = Math.min(ay, by); y <= Math.max(ay, by); y++) put(bx, y);
    } else {
      for (y = Math.min(ay, by); y <= Math.max(ay, by); y++) put(ax, y);
      for (x = Math.min(ax, bx); x <= Math.max(ax, bx); x++) put(x, by);
    }
  }
  function rectsClash(a, b, pad) {
    return !(a.x - pad >= b.x + b.w || a.x + a.w + pad <= b.x || a.y - pad >= b.y + b.h || a.y + a.h + pad <= b.y);
  }

  function generateMap() {
    grid = new Uint8Array(COLS * ROWS);

    rooms = [];
    for(var y=1;y<ROWS-1;y++)for(var x=1;x<COLS-1;x++)grid[y*COLS+x]=1;
    var gateRow=randi(8,ROWS-9);
    forestGate={x:(COLS-1.5)*TILE,y:(gateRow+.5)*TILE};
    var start={x:randi(7,10),y:randi(7,13)},end={x:48,y:clamp(gateRow+randi(-2,2),5,ROWS-6)},points=[start];
    for(var tries=0;tries<2000&&points.length<8;tries++){
      var c={x:rand(6,COLS-10),y:rand(5,ROWS-6)};
      if(dist(c.x,c.y,end.x,end.y)<8||points.some(function(p){return dist(c.x,c.y,p.x,p.y)<8.8}))continue;
      points.push(c);
    }
    // A bounded fallback fills unusually crowded seeds without placing overlapping clearings.
    if(points.length<8)for(var y=5;y<ROWS-5&&points.length<8;y+=5)for(var x=6;x<COLS-9&&points.length<8;x+=5){
      var c={x:x,y:y};if(dist(x,y,end.x,end.y)>7&&points.every(function(p){return dist(p.x,p.y,x,y)>7}))points.push(c);
    }
    var rest=points.slice(1).sort(function(a,b){return dist(a.x,a.y,start.x,start.y)-dist(b.x,b.y,start.x,start.y)});
    points=[start].concat(rest,[end]);
    points.forEach(function(c){rooms.push({x:clamp(Math.round(c.x-3),2,COLS-8),y:clamp(Math.round(c.y-2.5),2,ROWS-7),w:6,h:5});});

  function tileSolid(px, py) {
    var cx = Math.floor(px / TILE), cy = Math.floor(py / TILE);
    if (cx < 0 || cy < 0 || cx >= COLS || cy >= ROWS) return true;
    return grid[cy * COLS + cx] !== 1;
  }
  function blocked(px, py, r, ignoreProps) {
    if (tileSolid(px - r, py) || tileSolid(px + r, py) ||
      tileSolid(px, py - r) || tileSolid(px, py + r) ||
      tileSolid(px - r * 0.7, py - r * 0.7) || tileSolid(px + r * 0.7, py + r * 0.7) ||
      tileSolid(px - r * 0.7, py + r * 0.7) || tileSolid(px + r * 0.7, py - r * 0.7)) return true;
    // 木箱 / 木桶 为实体障碍（监管者忽略，避免与其寻路网格不一致而卡死）
    if (ignoreProps) return false;
    for (var i = 0; i < props.length; i++) {
      var pr = props[i];
      if (pr.solid === false) continue;
      var pdx = px - pr.x, pdy = py - pr.y;
      if (pdx * pdx + pdy * pdy < (r + pr.cr) * (r + pr.cr)) return true;
    }
    return false;
  }

    }
    return false;
  }

  function lineClear(ax, ay, bx, by) {
    var d = dist(ax, ay, bx, by), steps = Math.max(1, Math.ceil(d / 10));
    for (var i = 1; i < steps; i++) {
      var t = i / steps;
      if (tileSolid(lerp(ax, bx, t), lerp(ay, by, t))) return false;
    }
    return true;
  }

  /* ==========================================================
     A*
     ========================================================== */
  var DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  function findPath(sx, sy, gx, gy) {
    if (sx === gx && sy === gy) return [{ x: gx, y: gy }];
    var W = COLS;
    var open = [{ x: sx, y: sy, g: 0, f: 0 }];
    var gS = {}; gS[sy * W + sx] = 0;
    var came = {}, closed = {}, iter = 0;
    while (open.length && iter < 9000) {
      iter++;
      var bi = 0;
      for (var i = 1; i < open.length; i++) if (open[i].f < open[bi].f) bi = i;
      var cur = open.splice(bi, 1)[0];
      var ck = cur.y * W + cur.x;
      if (closed[ck]) continue;
      closed[ck] = 1;
      if (cur.x === gx && cur.y === gy) {
        var path = [{ x: gx, y: gy }], tk = ck;
        while (came[tk] !== undefined) { tk = came[tk]; path.push({ x: tk % W, y: Math.floor(tk / W) }); }
        path.reverse();
        return path;
      }
      for (var d = 0; d < 4; d++) {
        var nx = cur.x + DIRS[d][0], ny = cur.y + DIRS[d][1];
        if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;
        if (grid[ny * W + nx] !== 1) continue;
        var nk = ny * W + nx, ng = cur.g + 1;
        if (gS[nk] !== undefined && gS[nk] <= ng) continue;
        gS[nk] = ng; came[nk] = ck;
        open.push({ x: nx, y: ny, g: ng, f: ng + Math.abs(nx - gx) + Math.abs(ny - gy) });
      }
    }
    return null;
  }

  /* ==========================================================
     新一局
     ========================================================== */
  function pickMachineRooms(spawn, gateRooms) {
    var candidates = rooms.slice(1).filter(function (room) {
      return gateRooms.indexOf(room) === -1;
    }).map(roomCenter);
    var startX = Math.floor(spawn.x), startY = Math.floor(spawn.y);
    var nearest = 0, shortest = Infinity;
    candidates.forEach(function (center, i) {
      var path = findPath(startX, startY, Math.floor(center.x), Math.floor(center.y));
      if (path && path.length < shortest) {
        shortest = path.length;
        nearest = i;
      }
    });

    // Give players one nearby objective, then spread the others across the rooms.
    var chosen = candidates.splice(nearest, 1);
    while (chosen.length < 5) {
      var best = 0, widestGap = -1;
      candidates.forEach(function (center, i) {
        var gap = Math.min.apply(null, chosen.map(function (other) {
          return dist(center.x, center.y, other.x, other.y);
        }));
        if (gap > widestGap) { best = i; widestGap = gap; }
      });
      chosen.push(candidates.splice(best, 1)[0]);
    }
    return chosen;
  }

  var LAMP_FUEL_COST=20, LAMP_DURATION=60, LAMP_RADIUS=TILE*5;
  var fixedLightField=new Float32Array(COLS*ROWS), lightFieldClock=0;
  function fixedLightAt(x,y){
    var gx=x/TILE-.5,gy=y/TILE-.5,tx=Math.floor(gx),ty=Math.floor(gy),fx=gx-tx,fy=gy-ty;
    if(tx<0||ty<0||tx>=COLS-1||ty>=ROWS-1)return 0;
    var k=ty*COLS+tx;
    return (fixedLightField[k]*(1-fx)+fixedLightField[k+1]*fx)*(1-fy)+
      (fixedLightField[k+COLS]*(1-fx)+fixedLightField[k+COLS+1]*fx)*fy;
  }
  function refreshFixedLightField(){
    fixedLightField.fill(0);
    forestLights.forEach(function(light){
      if(light.remaining<=0)return;
      var tx=Math.floor(light.x/TILE),ty=Math.floor(light.y/TILE);
      for(var y=Math.max(1,ty-5);y<=Math.min(ROWS-2,ty+5);y++)for(var x=Math.max(1,tx-5);x<=Math.min(COLS-2,tx+5);x++){
        var px=(x+.5)*TILE,py=(y+.5)*TILE,d=dist(px,py,light.x,light.y);
        if(d>=LAMP_RADIUS)continue;
        var approach=Math.min(1,TILE*.65/Math.max(d,1));
        if(!lineClear(light.x,light.y,px+(light.x-px)*approach,py+(light.y-py)*approach))continue;
        var strength=Math.pow(1-d/LAMP_RADIUS,.65)*Math.min(1,light.remaining/3);
        fixedLightField[y*COLS+x]=Math.max(fixedLightField[y*COLS+x],strength);
      }
    });
  }
  function updateForestLights(dt){

      if(was>0&&light.remaining===0){expired=true;light.progress=0;}
    });
    lightFieldClock-=dt;
    if(expired||lightFieldClock<=0){refreshFixedLightField();lightFieldClock=.15;}
  }
  function interactFixedLamp(dt){

      var dx=light.x-player.x,dy=light.y-player.y,d=Math.hypot(dx,dy);

    });

  function populateForestSearch() {

  function exploreForest(dt) {
    if(S.forestAlarm){
      S.forestAlarm.left-=dt;S.forestAlarm.pulse-=dt;
      if(S.forestAlarm.pulse<=0){S.forestAlarm.pulse=1.3;Sfx.bad();}
      if(S.forestAlarm.left<=0)S.forestAlarm=null;
    }
    var node=null,best=FOREST_SIGHT*1.5;
    forestSearch.forEach(function(p){
      if(p.searched && !p.note)return;
      var d=dist(player.x,player.y,p.x,p.y);
      var facing=((p.x-player.x)*Math.cos(player.a)+(p.y-player.y)*Math.sin(player.a))/Math.max(d,1);
      if(d<best && (d<18||facing>.15) && lineClear(player.x,player.y,p.x,p.y)){node=p;best=d;}
    });
    if(!node || nearMate || (nearTarget && dist(player.x,player.y,nearTarget.obj.x,nearTarget.obj.y)<best))return false;
    var names={thicket:'潮湿灌木',stump:'腐朽树桩',forestTrap:'锈蚀陷阱',hollowLog:'中空倒木',trailSign:'林间路牌'};
    if(node.note && node.searched){setPrompt(node.note);return true;}
    setPrompt((node.hidden?'隐蔽藏匿处':names[node.kind])+' · 长按 E 探索 '+Math.floor(node.progress)+'% · 可能有物资或警报');
    if(!interactHeld())return true;
    node.progress=Math.min(100,node.progress+dt*50);
    if(node.progress<100)return true;
    node.searched=true;
    if(node.note){Sfx.ding();toast(node.note,7);return true;}
    if(node.alarm){
      S.forestAlarm={x:node.x,y:node.y,left:10,pulse:1.3};Sfx.bad();Sfx.whisper();

      if(node.reward==='oil')roll=0;
      if(roll<.40){S.fuel=Math.min(100,S.fuel+25);reward='灯油 +25';}
      else if(roll<.65){S.baits=Math.min(6,S.baits+1);reward='发声诱饵 +1';}
      else{var material=escapeMaterials[randi(0,escapeMaterials.length-1)],amount=material.item==='nails'?2:1;S.inventory[material.item]+=amount;reward=material.label+' +'+amount;}

    }
    return true;
  }


  function setupForestPlaces() {
    var names=['守林营地','断桥林地','旧猎屋','苔石祭坛','枯井空地','失落货场','乌鸦墓园','废弃哨站','林缘车站'];
    forestPlaces=rooms.map(function(r,i){var c=roomCenter(r);return {x:c.x*TILE,y:c.y*TILE,name:names[i],seen:false};});
    forestPlaces.forEach(function(place,i){
      // Large silhouettes make each clearing recognizable when approached through fog.
      var landmarkKinds=['forestTent','ruin','ruin','forestShrine','forestShrine','forestWagon','forestShrine','ruin','forestWagon'];
      var candidateOffsets=[[60,40],[-60,40],[60,-40],[-60,-40]];
      candidateOffsets.some(function(offset){
        var lx=place.x+offset[0],ly=place.y+offset[1];
        if(blocked(lx,ly,16) || machines.concat(gates,props).some(function(p){return dist(lx,ly,p.x,p.y)<45}))return false;
        props.push({x:lx,y:ly,kind:landmarkKinds[i],h:i===0?1.1:(landmarkKinds[i]==='ruin'?1.7:1.0),glow:0,yOff:0,solid:false,cr:0});return true;

      var exit=gates.find(function(g){return dist(g.x,g.y,place.x,place.y)<200;});
      var note=place.name+'：'+(exit&&exit.route?'附近有'+exit.route.name+'，需要灯丝 ×2、麻绳 ×2、钉子 ×4。':
        (clue?(clue.package?'附近补给箱存有'+clue.package.label+' ×'+clue.package.need+'。':'这里留有灯油补给。'):'沿褐色林径通往其他空地，林径外的藏匿处可能留有物资。'));
      var sign={x:sx,y:sy,kind:'trailSign',h:.85,glow:0,yOff:0,solid:false,cr:0,searched:false,progress:0,note:note};

    if(guide)guide.alarm=false;

  function throwBait() {
    if (S.phase !== 'play' || S.side !== 'survivor') return;
    if (!S.baits) { toast('诱饵已用完，寻找补给箱', 2); return; }
    var x = player.x, y = player.y;
    for (var step = 20; step <= 240; step += 20) {
      var nx = player.x + Math.cos(player.a)*step, ny = player.y + Math.sin(player.a)*step;
      if (tileSolid(nx, ny)) break;
      x = nx; y = ny;
    }
    S.baits--;
    S.bait = { x:x, y:y, left:9, pulse:0 };
    Sfx.ding();
    toast('发声诱饵已投出，持续 9 秒', 2);
  }

  function escapeInteract(dt) {
    if (S.side !== 'survivor') return;
    S.fuel = Math.max(0, S.fuel - (S.lampOn ? .37 : 0)*dt);
    player.torch = S.lampOn && S.fuel > 0 ? CHARS[S.charKey].torch : 1.1;
    if (S.bait) {
      S.bait.left -= dt;
      S.bait.pulse -= dt;
      if (S.bait.pulse <= 0) {
        S.bait.pulse = .8;
        if (dist(player.x,player.y,S.bait.x,S.bait.y)<620) Sfx.machineTick(Math.floor(S.bait.left));
      }
      if (S.bait.left <= 0) S.bait = null;
    }
    if (interactFixedLamp(dt)) return;
    if (exploreForest(dt)) return;
    if (!nearTarget || nearMate) return;
    if (!lineClear(player.x,player.y,nearTarget.obj.x,nearTarget.obj.y)) { setPrompt('目标在墙后，绕到正面'); return; }
    var target = nearTarget.obj;
    if (nearTarget.type === 'machine') {
      var contents = target.package ? target.package.label + ' ×'+target.package.need : '灯油与诱饵';
      setPrompt('补给箱 · ' + contents + ' · 按住 E 搜索 ' + Math.floor(target.progress) + '%');
      if (!interactHeld()) return;
      target.progress = Math.min(100, target.progress + dt*34);
      updateMachineAudio(target, dt);
      if (target.progress < 100) return;
      target.done = true; S.decoded++;
      S.fuel = Math.min(100,S.fuel+36);
      S.baits = Math.min(6,S.baits+1);
      if (target.package) S.inventory[target.package.item] += target.package.need;

    } else {

  }

  function drawEscapeLabels() {
    if (S.side !== 'survivor') return;
    var targets = gates.map(function (g) {
      return { x:g.x,y:g.y,text:g.route.name,color:g.route.color };
    });
    machines.filter(function (m) { return !m.done; }).forEach(function (m) {
      targets.push({x:m.x,y:m.y,text:m.package ? m.package.label : '灯油补给',color:'#9bcced'});
    });
    targets.forEach(function (target) {
      var dx=target.x-player.x, dy=target.y-player.y;
      var forward=dx*Math.cos(player.a)+dy*Math.sin(player.a);
      if (forward < 20 || Math.hypot(dx,dy)>=FOREST_SIGHT*1.7 || !lineClear(player.x,player.y,target.x,target.y)) return;
      var right=-dx*Math.sin(player.a)+dy*Math.cos(player.a);
      var x=VW/2*(1+right/forward/PLANE_K);
      if (x < 55 || x > VW-55) return;
      ctx.save();
      ctx.font='12px system-ui'; ctx.textAlign='center';
      ctx.fillStyle=target.color; ctx.shadowColor='#000'; ctx.shadowBlur=5;
      ctx.fillText(target.text+' · '+Math.round(Math.hypot(dx,dy)/TILE)+'m',x,VH*.37);
      ctx.restore();
    });
  }

  function newGame(charKey, diffKey, seedOverride) {
    S.seed=(seedOverride==null?(new URLSearchParams(location.search).get('seed') || ((Date.now()^Math.floor(Math.random()*0xffffffff))>>>0)):seedOverride)>>>0;
    generationRandom=makeRandom(S.seed);
    S.charKey = charKey || S.charKey;
    S.diffKey = diffKey || S.diffKey;
    S.time = 0; S.decoded = 0; S.calibHits = 0; S.calibMiss = 0;
