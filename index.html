  function pauseGame() {
    if (S.phase !== 'play') return;
    S.phase = 'pause';
    Sfx.stopScore();
    el.sheet.innerHTML =
      '<div class="modal">' +
      '<h2>暂停</h2>' +
      '<p class="muted">庄园的雾暂时停了下来。按 Esc 继续。</p>' +
      '<div class="row-btns"><button class="primary" id="resumeBtn">继续</button>' +
      '<button class="ghost" id="restartBtn">重新开始</button></div>' +
      '</div>';
    el.overlay.classList.remove('hidden');
  }

  function resumeGame() {
    if (S.phase !== 'pause') return;
    Sfx.init();
    Sfx.startScore();
    S.phase = 'play';
    el.overlay.classList.add('hidden');
  }

  function showResult() {
    var win = S.win;
    var t = Math.floor(S.time);
    var tstr = Math.floor(t / 60) + ' 分 ' + (t % 60) + ' 秒';
    var verdict, line, stats;
    if (S.side === 'hunter') {
      verdict = win ? '狩猎完成' : '猎物逃脱';
      line = win ? '雾散了，庄园重新安静下来。今晚没有人能逃出去。' : '逃生门在眼前合上 —— 你听见了雾里的脚步远去。';
      stats =
        '<div><span>用时</span><b>' + tstr + '</b></div>' +
        '<div><span>淘汰</span><b>' + countDead() + ' / ' + mates.length + '</b></div>' +
        '<div><span>击倒</span><b>' + S.downs + '</b></div>' +
        '<div><span>命中</span><b>' + S.hits + '</b></div>' +
        '<div><span>逃脱</span><b>' + countEscaped() + '</b></div>';
    } else {
      verdict = win ? '逃脱成功' : '被抓住了';
      line = win ? '你推开了庄园的门，雾气在身后缓缓合拢。' : '铁钩落下，庄园又留下了一位客人。';
      stats =
        '<div><span>用时</span><b>' + tstr + '</b></div>' +
        '<div><span>补给箱</span><b>' + S.decoded + ' / 5</b></div><div><span>逃生出口</span><b>'+(S.escapeName || '未完成')+'</b></div>' +
        '<div><span>剩余灯油</span><b>' + Math.ceil(S.fuel) + '%</b></div>' +
        '<div><span>剩余诱饵</span><b>' + S.baits + '</b></div>';
    }
    el.sheet.innerHTML =
      '<div class="modal result ' + (win ? 'win' : 'lose') + '">' +
      '<div class="verdict">' + verdict + '</div>' +
      '<p class="muted">' + line + '</p>' +
      '<div class="stats">' + stats + '</div>' +
      '<div class="row-btns"><button class="primary" id="againBtn">再来一局</button>' +
      '<button class="ghost" id="menuBtn">返回选择</button></div>' +
      '</div>';
    el.overlay.classList.remove('hidden');
    el.hud.classList.add('hidden');
  }

  el.sheet.addEventListener('change', function (ev) {
    if (ev.target.id === 'opponentSelect') S.opponentKey = ev.target.value;
  });

  el.sheet.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-char], [data-diff], [data-side], [data-hunter], button');
    if (!t) return;
    if (t.dataset.side) {
      if (S.side !== t.dataset.side) {
        S.side = t.dataset.side;
        var controlsOpen = el.sheet.querySelector('.controls').open;
        showStart();
        el.sheet.querySelector('.controls').open = controlsOpen;
        el.sheet.querySelector('[data-side="' + S.side + '"]').focus();
      }
      return;
    }
    if (t.dataset.hunter) {
      S.hunterKey = t.dataset.hunter;
      Array.prototype.forEach.call(el.sheet.querySelectorAll('[data-hunter]'), function (n) {
        n.classList.toggle('selected', n.dataset.hunter === S.hunterKey);
      });
      syncMenuSelection();
      return;
    }
    if (t.dataset.char) {
      S.charKey = t.dataset.char;
      Array.prototype.forEach.call(el.sheet.querySelectorAll('.char-card'), function (n) {
        n.classList.toggle('selected', n.dataset.char === S.charKey);
      });
      syncMenuSelection();
      return;
    }
    if (t.dataset.diff) {
      var dk = t.dataset.diff;
      if (S.side === 'hunter') S.aiKey = dk; else S.diffKey = dk;
      Array.prototype.forEach.call(el.sheet.querySelectorAll('.diff'), function (n) {
        n.classList.toggle('selected', n.dataset.diff === dk);
      });
      syncMenuSelection();
      return;
    }
    if (t.id === 'startBtn' || t.id === 'againBtn') {
      Sfx.init(); newGame(S.charKey, S.diffKey);
      return;
    }
    if (t.id === 'resumeBtn') { resumeGame(); return; }
    if (t.id === 'restartBtn') { newGame(S.charKey, S.diffKey); return; }
    if (t.id === 'menuBtn') { S.phase = 'menu'; showStart(); return; }
  });
  document.getElementById('lampToggle').onclick = toggleLamp;
  document.getElementById('baitThrow').onclick = throwBait;
  el.pauseBtn.addEventListener('click', function () {
    if (S.phase === 'play') pauseGame();
  });

  /* ---------------- 触屏 ---------------- */
  (function setupTouch() {
    if (!isTouch) return;
    document.body.classList.add('touch');
    var pad = document.getElementById('joypad');
    var knob = document.getElementById('joyknob');
    var btnE = document.getElementById('btnE');
    var btnSpace = document.getElementById('btnSpace');
    var btnRun = document.getElementById('btnRun');

    if (pad) {
      pad.addEventListener('pointerdown', function (e) {
        touch.active = true; touch.id = e.pointerId;
        try { pad.setPointerCapture(e.pointerId); } catch (err) { }
        moveKnob(e);
      });
      pad.addEventListener('pointermove', function (e) {
        if (!touch.active || e.pointerId !== touch.id) return;
        moveKnob(e);
      });
      function reset() {
        touch.active = false; touch.dx = 0; touch.dy = 0;
        if (knob) knob.style.transform = 'translate(-50%,-50%)';
      }
      pad.addEventListener('pointerup', reset);
      pad.addEventListener('pointercancel', reset);
      function moveKnob(e) {
        var r = pad.getBoundingClientRect();
        var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        var dx = e.clientX - cx, dy = e.clientY - cy;
        var max = r.width / 2 - 14;
        var m = Math.sqrt(dx * dx + dy * dy);
        if (m > max) { dx = dx / m * max; dy = dy / m * max; }
        touch.dx = dx / max; touch.dy = dy / max;
        if (knob) knob.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
      }
    }

    // 右半屏拖动转视角
    var lookZone = document.getElementById('lookZone');
    if (lookZone) {
      lookZone.addEventListener('pointerdown', function (e) {
        if (S.phase !== 'play') return;
        touch.lookId = e.pointerId; touch.lx = e.clientX;
        try { lookZone.setPointerCapture(e.pointerId); } catch (err) { }
      });
      lookZone.addEventListener('pointermove', function (e) {
        if (touch.lookId !== e.pointerId || S.phase !== 'play') return;
        var dx = e.clientX - touch.lx;
        touch.lx = e.clientX;
        player.a = normAng(player.a + dx * 0.006);
      });
      function lookEnd(e) { if (touch.lookId === e.pointerId) touch.lookId = null; }
      lookZone.addEventListener('pointerup', lookEnd);
      lookZone.addEventListener('pointercancel', lookEnd);
    }

    function holdBtn(node, on, off) {
      if (!node) return;
      node.addEventListener('pointerdown', function (e) { e.preventDefault(); on(); });
      node.addEventListener('pointerup', function (e) { e.preventDefault(); off(); });
      node.addEventListener('pointerleave', function () { off(); });
      node.addEventListener('pointercancel', function () { off(); });
    }
    holdBtn(btnE, function () { touch.e = true; Sfx.init(); }, function () { touch.e = false; });
    holdBtn(btnRun, function () { touch.run = true; }, function () { touch.run = false; });
    holdBtn(btnSpace, function () { Sfx.init(); if (S.phase === 'play') tryCalibrate(); }, function () { });
  })();

  window.render_game_to_text=function(){return JSON.stringify({
    phase:S.phase,side:S.side,view:'first-person',seed:S.seed,time:S.time,
    player:player?{x:player.x,y:player.y,angle:player.a,hp:player.hp}:null,
    lamp:{on:S.lampOn,fuel:S.fuel},fixedLamps:forestLights.map(function(l){return {x:l.x,y:l.y,remaining:l.remaining};}),gateReady:S.side==='survivor'?gateMaterialsReady():false,won:S.win,baits:S.baits,inventory:S.inventory,
    discovered:forestPlaces.filter(function(p){return p.seen}).map(function(p){return p.name}),
    searched:S.journeyFinds||0,alarm:S.forestAlarm?{x:S.forestAlarm.x,y:S.forestAlarm.y,left:S.forestAlarm.left}:null,
    hunter:hunter?{state:hunter.state,awareness:hunter.awareness}:null,hunterIntel:{tracks:S.hunterTracks||[],alarms:S.hunterPings||[]},
    journal:!!S.journalOpen,prompt:el.prompt.textContent
  });};

  /* ---------------- 启动 ---------------- */
  buildTextures();
  buildSprites();
  buildSurvivorSprites();
  buildHunterSprites();
  buildForestSprites();
  buildForestObstacles();
  buildPixelAtlas();
  buildFirstPersonPixelAssets();
  buildForestSearchSprites();
  buildUnifiedForestArt();
  buildFixedLampSprites();
  window.addEventListener('resize', function () { resize(); });
  resize();
  showStart();
  requestAnimationFrame(loop);
})();
