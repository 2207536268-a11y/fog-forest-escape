    S.heartPhase = 1; S.audioMachine = null; S.flash = 0; S.shake = 0; S.win = false; S.danger = 0;
    machines = []; gates = []; particles = []; floaters = []; crows = [];
    props = []; motes = []; planks = []; mates = []; nearMate = null;
    calib.active = false; calib.cooldown = 3.2; calib.pos = 0; calib.dir = 1; calib.missTimer = 0;
    nearTarget = null;

    generateMap();
    var isHunter = S.side === 'hunter';
    var ch = isHunter ? HUNTERS[S.hunterKey] : CHARS[S.charKey];

    var spawnRoom = rooms[0], sc = roomCenter(spawnRoom);
    player = {
      x: sc.x * TILE, y: sc.y * TILE, a: rand(0, TAU), pitch: 0, r: isHunter ? 14 : 12,
      hp: 3, maxHp: 3, stam: 100, stamCd: 0,
      speedMul: ch.speed, torch: isHunter ? 9.4 : ch.torch, invuln: 0, boost: 0, healUsed: false,
      bob: 0, bobY: 0, bobX: 0, stepT: 0,
      vx: 0, vy: 0, running: false, decoding: false, sway: 0, lightFlick: 0,
      // 监管者模式专用
      stun: 0, swing: 0, swingCd: 0,
      reach: (ch.reach || 1) * 98, swingTime: ch.swing || 0.6, runMul: ch.run || 1.34
    };

    var gateRooms=[rooms[8]];
    gates.push({id:'A',x:forestGate.x,y:forestGate.y,progress:0,open:false,powered:false});

    pickMachineRooms(sc,gateRooms).forEach(function (c, i) {
      var x = (c.x + rand(-.65, .65)) * TILE;
      var y = (c.y + rand(-.65, .65)) * TILE;
      machines.push({ id: i, x: x, y: y, progress: 0, done: false, pulse: 0, spark: 0, bob: rand(0, TAU) });
    });

    if (!isHunter) {
      var best = -1, bestRoom = rooms[1];
      rooms.forEach(function (r) {
        var c = roomCenter(r), d = dist(c.x, c.y, sc.x, sc.y);
        if (d > best) { best = d; bestRoom = r; }
      });
      var fc = roomCenter(bestRoom);
      var hunterKeys = Object.keys(HUNTERS);
      var opponent = S.opponentKey === 'random' ? hunterKeys[randi(0, hunterKeys.length - 1)] : S.opponentKey;
      hunter = {
        heading: rand(0, TAU), awareness: 0, key: opponent, attackTime: HUNTERS[opponent].swing, attackLeft: 0,
        x: fc.x * TILE, y: fc.y * TILE, r: 14,
        state: 'patrol', path: null, pathTimer: 0, waypoint: 0,
        lastSeen: null, lostTimer: 0, stun: 0,
        patrolTarget: null, searchTimer: 0, stuckT: 0,
        walk: 0, face: 1, glow: 0, lunge: 0, stepDistance: 0
      };
    } else {
      // 监管者模式：玩家就是监管者，场上不再有 AI 监管者
      hunter = null;
    }

    // 乌鸦
    for (var ci = 0; ci < 5; ci++) {
      var rm = rooms[randi(0, rooms.length - 1)], rc = roomCenter(rm);
      crows.push({ x: rc.x * TILE, y: rc.y * TILE, s: rand(0, TAU), sp: rand(0.4, 0.9) });
    }

    // 场景摆件：每个房间随机摆放木箱 / 木桶 / 烛台 / 枯枝 / 吊灯
    var propKinds = [
      { k: 'branch', h: 1.5, glow: 0, yOff: 0 },
      { k: 'branch', h: 1.8, glow: 0, yOff: 0 },
      { k: 'branch', h: 1.2, glow: 0, yOff: 0 },
      { k: 'branch', h: 1.55, glow: 0, yOff: 0 },
      { k: 'branch', h: 1.6, glow: 0, yOff: 0 }
    ];
    rooms.forEach(function (r) {
      var cnt = randi(1, 3);
      for (var pi = 0; pi < cnt; pi++) {
        var pk = propKinds[randi(0, propKinds.length - 1)];
        var px2 = 0, py2 = 0, ok = false, tries2 = 0;
        while (tries2 < 26) {
          tries2++;
          px2 = (r.x + rand(1, Math.max(1.2, r.w - 1))) * TILE;
          py2 = (r.y + rand(1, Math.max(1.2, r.h - 1))) * TILE;
          if (blocked(px2, py2, 18)) continue;
          if (dist(px2, py2, sc.x * TILE, sc.y * TILE) < 120) continue;
          var far = true;
          for (var mi2 = 0; mi2 < machines.length; mi2++) {
            if (dist(px2, py2, machines[mi2].x, machines[mi2].y) < 76) { far = false; break; }
          }
          for (var gi2 = 0; gi2 < gates.length && far; gi2++) {
            if (dist(px2, py2, gates[gi2].x, gates[gi2].y) < 90) { far = false; break; }
          }
          if (!far) continue;
          ok = true; break;
        }
        if (!ok) continue;
        var solid = (pk.k === 'crate' || pk.k === 'barrel');
        props.push({
          x: px2, y: py2, kind: pk.k, h: pk.h, glow: pk.glow, yOff: pk.yOff,
          solid: solid, cr: solid ? 15 : 0
        });
      }
    });

    // 空气中的尘埃
    for (var mi3 = 0; mi3 < 300; mi3++) {
      var mx3 = rand(1, COLS - 2), my3 = rand(1, ROWS - 2);
      if (grid[Math.floor(my3) * COLS + Math.floor(mx3)] !== 1) continue;
      motes.push({
        x: mx3 * TILE, y: my3 * TILE, h: rand(0.3, 1.75),
        ph: rand(0, TAU), sp: rand(0.18, 0.6), sz: rand(0.7, 2.1)
      });
    }

    // 队友：从角色池里选 2 名，出生在离玩家较远的房间
    S.rescued = 0;
    var pool = MATE_POOL.filter(function (m) { return m.key !== S.charKey; });
    for (var pi5 = pool.length - 1; pi5 > 0; pi5--) {
      var pj5 = randi(0, pi5), pt5 = pool[pi5]; pool[pi5] = pool[pj5]; pool[pj5] = pt5;
    }
    // 监管者模式：4 名求生者全部在场，互相分散，由玩家捕猎
    var mateCount = isHunter ? 4 : 2;
    if (isHunter) pool = MATE_POOL.slice();
    for (var mi5 = 0; mi5 < Math.min(mateCount, pool.length); mi5++) {
      var mpt = null, mtries = 0;
      while (mtries < 80) {
        mtries++;
        var mrm = rooms[randi(0, rooms.length - 1)];
        var mrc = roomCenter(mrm);
        var mx5 = (mrc.x + rand(-1.6, 1.6)) * TILE;
        var my5 = (mrc.y + rand(-1.2, 1.2)) * TILE;
        if (blocked(mx5, my5, 14)) continue;
        if (dist(mx5, my5, sc.x * TILE, sc.y * TILE) < (isHunter ? 280 : 220)) continue;
        var tooClose = false;
        for (var mz = 0; mz < mates.length; mz++) {
          if (dist(mx5, my5, mates[mz].x, mates[mz].y) < 180) { tooClose = true; break; }
        }
        if (tooClose) continue;
        mpt = { x: mx5, y: my5 }; break;
      }
      if (!mpt) continue;
      mates.push({
        name: pool[mi5].name, key: pool[mi5].key,
        x: mpt.x, y: mpt.y, r: 11,
        down: false, dead: false, downT: 0, rescueT: 0, invuln: 0,
        hp: isHunter ? 2 : 99, escaped: false, hitFx: 0, gateT: 0,
        face: 1, stride: 0, moveX: 0, moveY: 0, moving: false, wp: null, wpT: 0, flee: 0
      });
    }

    // 木板关卡：布置在走廊窄口，靠近后按 E 推倒
    function gAt(gx, gy) {
      if (gx < 0 || gy < 0 || gx >= COLS || gy >= ROWS) return 0;
      return grid[gy * COLS + gx];
    }
    var plankCand = [];
    for (var py4 = 1; py4 < ROWS - 1; py4++) {
      for (var px4 = 1; px4 < COLS - 1; px4++) {
        if (gAt(px4, py4) !== 1) continue;
        // 走廊为 2 格宽：行进方向通畅，垂直方向至少一侧贴墙即为窄口
        var openV = gAt(px4, py4 - 1) === 1 && gAt(px4, py4 + 1) === 1;
        var openH = gAt(px4 - 1, py4) === 1 && gAt(px4 + 1, py4) === 1;
        var wallSideX = gAt(px4 - 1, py4) !== 1 || gAt(px4 + 1, py4) !== 1;
        var wallSideY = gAt(px4, py4 - 1) !== 1 || gAt(px4, py4 + 1) !== 1;
        var corrV = openV && wallSideX;
        var corrH = openH && wallSideY;
        if (!corrV && !corrH) continue;
        plankCand.push({ x: px4 * TILE + TILE / 2, y: py4 * TILE + TILE / 2 });
      }
    }
    for (var si2 = plankCand.length - 1; si2 > 0; si2--) {
      var sj2 = randi(0, si2), st2 = plankCand[si2];
      plankCand[si2] = plankCand[sj2]; plankCand[sj2] = st2;
    }
    var placedP = 0;
    for (var ci4 = 0; ci4 < plankCand.length && placedP < 14; ci4++) {
      var ca2 = plankCand[ci4];
      if (dist(ca2.x, ca2.y, sc.x * TILE, sc.y * TILE) < 120) continue;
      var skip = false;
      for (var pj2 = 0; pj2 < planks.length; pj2++) {
        if (dist(ca2.x, ca2.y, planks[pj2].x, planks[pj2].y) < 150) { skip = true; break; }
      }
      if (!skip) for (var mk4 = 0; mk4 < machines.length; mk4++) {
        if (dist(ca2.x, ca2.y, machines[mk4].x, machines[mk4].y) < 74) { skip = true; break; }
      }
      if (!skip) for (var gk4 = 0; gk4 < gates.length; gk4++) {
        if (dist(ca2.x, ca2.y, gates[gk4].x, gates[gk4].y) < 96) { skip = true; break; }
      }
      if (skip) continue;
      planks.push({ x: ca2.x, y: ca2.y, down: false, t: 0, blockT: 0, hitFx: 0 });
      placedP++;
    }

    // 每局不同的空气色调：用低透明度全屏叠加实现，避免与已烘焙材质产生接缝
    var AMB = [
      'rgba(40,66,120,0.085)',   // 冷蓝夜雾
      'rgba(96,110,58,0.075)',   // 霉绿
      'rgba(126,52,30,0.080)',   // 铁锈暖调
      'rgba(84,52,124,0.085)',   // 紫灰
      'rgba(46,104,104,0.075)',  // 青苔
      'rgba(118,96,52,0.080)'    // 旧烛黄
    ];
    S.ambient = AMB[randi(0, AMB.length - 1)];
    S.ambientDark = 0.05 + worldRandom() * 0.07;

    setupEscapeMode();
    populateForest();
    addForestEncounters();
    populateForestSearch();
    populateSecretFinds();
    setupForestPlaces();
    setupExplorationJourney();
    generationRandom=null;
    S.phase = 'play';
    el.overlay.classList.add('hidden');
    el.hud.classList.remove('hidden');
    S.hintTimer = 4.5;
    if (el.lookHint){el.lookHint.textContent='W A S D 移动 · ← → 转动视角 · Shift 冲刺'+(S.side==='hunter'?' · 追踪地图自动出现':' · M 手绘地图');el.lookHint.classList.add('show');}
    updateHud(true);
    setPrompt('');
    updateMateHud();
    Sfx.stopScore();
    Sfx.startScore();
    if (S.side === 'hunter') {
      toast('靠近发现求生者后显示临时追踪地图 · 警报会标记声源方向', 4.2);
    } else {
      toast('先搜索前方树桩的安全补给，再沿林径探索 · M 手绘地图', 5);
    }
  }

  /* ==========================================================
     HUD
     ========================================================== */
  function toast(text, sec) {
    el.toast.textContent = text;
    el.toast.classList.add('show');
    S.toastTimer = sec || 2.6;
  }
  function setPrompt(text) {
    if (lastHud.prompt === text) return;
    lastHud.prompt = text;
    if (!text) el.prompt.classList.remove('show');
    else { el.prompt.textContent = text; el.prompt.classList.add('show'); }
  }
  function heartSvg(filled) {
    return '<svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">' +
      '<path d="M12 20.5S3.6 15.3 2.2 10.4C1.2 6.9 3.5 4 6.6 4c2 0 3.6 1 4.4 2.4C11.8 5 13.4 4 15.4 4c3.1 0 5.4 2.9 4.4 6.4C18.4 15.3 12 20.5 12 20.5z" ' +
      'fill="' + (filled ? '#b8352f' : 'rgba(255,255,255,0.06)') + '" stroke="' + (filled ? '#e8847c' : 'rgba(255,255,255,0.18)') + '" stroke-width="1.1"/></svg>';
  }
  function updateHud(force) {
    var ch = S.side === 'hunter' ? HUNTERS[S.hunterKey] : CHARS[S.charKey];
    var idKey = S.side + ':' + (S.side === 'hunter' ? S.hunterKey : S.charKey);
    document.getElementById('escapeTools').style.display = S.side === 'survivor' ? 'flex' : 'none';
    document.getElementById('forestCompass').style.display = S.side === 'survivor' ? '' : 'none';
    document.getElementById('escapeInfo').style.display = S.side === 'survivor' ? '' : 'none';
    document.querySelector('.cipher-label').textContent = '补给箱';
    if (force || lastHud.charKey !== idKey) {
      lastHud.charKey = idKey;
      el.charName.textContent = ch.name;
    }
    if (force || lastHud.hp !== player.hp) {
      lastHud.hp = player.hp;
      var html = '';
      for (var i = 0; i < player.maxHp; i++) html += heartSvg(i < player.hp);
      el.hearts.innerHTML = html;
    }
    if (force || lastHud.decoded !== S.decoded) {
      lastHud.decoded = S.decoded;
      el.decodedCount.textContent = String(S.decoded);
      var pills = '';
      for (var j = 0; j < 5; j++) pills += '<i class="pill' + (j < S.decoded ? ' on' : '') + '"></i>';
      el.cipherPills.innerHTML = pills;
    }
    var t = Math.floor(S.time);
    var tstr = ('0' + Math.floor(t / 60)).slice(-2) + ':' + ('0' + (t % 60)).slice(-2);
    if (lastHud.timer !== tstr) { lastHud.timer = tstr; el.timer.textContent = tstr; }
    var stam = Math.round(clamp(player.stam, 0, 100));
    if (lastHud.stam !== stam) {
      lastHud.stam = stam;
      el.staminaFill.style.width = stam + '%';
      el.staminaFill.classList.toggle('low', stam < 25);
    }
    var obj;
    if (S.side === 'hunter') {
      var aliveN = 0;
      for (var ai = 0; ai < mates.length; ai++) { var am = mates[ai]; if (!am.dead && !am.escaped) aliveN++; }
      obj = '淘汰求生者（已淘汰 ' + countDead() + ' / ' + mates.length + '，逃脱 ' + countEscaped() + '）';
      if (aliveN === 0) obj = '所有人已被解决';
    } else {
      obj = '灯油 '+Math.ceil(S.fuel)+'% · '+(S.lampOn && S.fuel>0 ? '亮灯' : '熄灯')+' · 诱饵 '+S.baits +
        (hunter ? (hunter.state === 'chase' && hunter.targetObj === player ? ' · 被追踪' :
          (hunter.awareness > .12 ? ' · 正被注意' : (!S.lampOn || S.fuel<=0 ? ' · 暗处潜行' : ' · 灯光暴露'))) : '');
      document.getElementById('escapeInfo').textContent =
        gateMaterialsText();

    }
    if (lastHud.obj !== obj) { lastHud.obj = obj; el.objective.textContent = obj; }

    var d = player && hunter ? dist(player.x, player.y, hunter.x, hunter.y) : nearestMateDist();
    var danger = 0;
    if (S.side === 'hunter') {
      // 监管者视角：求生者越近，画面越亮红（狩猎快感）
      if (d < 300) danger = (1 - d / 300) * 0.5;
    } else {
      if (d < 320) danger = (1 - d / 320) * 0.9;
      if (player.hp <= 1) danger = Math.max(danger, 0.4);
    }
    S.danger = lerp(S.danger, danger, 0.09);
    if (el.danger) {
      var dop = Math.round(S.danger * 20) / 20;
      if (dop !== lastHud.dop) { lastHud.dop = dop; el.danger.style.opacity = String(dop * 0.8); }
    }
  }

  /* ==========================================================
     输入
     ========================================================== */
  window.addEventListener('keydown', function (e) {
    if (S.phase === 'menu' && e.target.id === 'opponentSelect') return;
    var k = e.key.toLowerCase();
    if (k === ' ' || k === 'spacebar' || e.code === 'Space') {
      e.preventDefault();
      if (S.phase === 'play') { if (S.side === 'hunter') doSwing(); else if (S.side !== 'survivor') tryCalibrate(); }
      return;
    }
    if (k === 'escape') {
      if (S.phase === 'play') pauseGame();
      else if (S.phase === 'pause') resumeGame();
      return;
    }
    if (k === 'enter' && S.phase === 'menu') { Sfx.init(); newGame(S.charKey, S.diffKey); return; }
    if (k === 'm' && !e.repeat && S.phase==='play' && S.side==='survivor')toggleJournal();
    if (k === 'f' && !e.repeat) toggleLamp();
    if (k === 'q' && !e.repeat) throwBait();
    if (k === 'e' && !keys['e'] && S.phase === 'play') eEdge = true;
    keys[k] = true;
    if (k === 'shift') keys.shift = true;
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright'].indexOf(k) >= 0) e.preventDefault();
  });
  window.addEventListener('keyup', function (e) {
    var k = e.key.toLowerCase();
    keys[k] = false;
    if (k === 'shift') keys.shift = false;
  });
  window.addEventListener('blur', function () {
    keys = {}; touch.active = false; touch.dx = 0; touch.dy = 0;
    if (S.phase === 'play') pauseGame();
  });

  // 视角：纯键盘操作，← → 转动视角（不使用鼠标）

  var TURN_SPEED = 2.35;   // 弧度/秒，按住方向键时的转身速度

  function inputVector(dt) {
    var f = 0, s = 0;
    if (keys['w']) f += 1;
    if (keys['s']) f -= 1;
    if (keys['d']) s += 1;
    if (keys['a']) s -= 1;
    // 左右方向键转身
    var turn = 0;
    if (keys['arrowleft']) turn -= 1;
    if (keys['arrowright']) turn += 1;
    if (turn && player && dt > 0) player.a = normAng(player.a + turn * TURN_SPEED * dt);
    if (touch.active) { f += -touch.dy; s += touch.dx; }
    var m = Math.sqrt(f * f + s * s);
    if (m > 1) { f /= m; s /= m; }
    return { f: f, s: s };
  }
  function interactHeld() { return !!keys['e'] || touch.e; }

  /* ==========================================================
     校准
     ========================================================== */
  function startCalib() {
    var ch = CHARS[S.charKey];
    var tol = ch.calibTol || 1;
    calib.active = true;
    calib.pos = 0; calib.dir = 1;
    calib.speed = rand(0.42, 0.62);
    calib.width = clamp(0.1 * tol, 0.08, 0.2);
    calib.band = rand(0.42, 0.86 - calib.width);
    calib.missTimer = 0;
    el.calibBand.style.left = (calib.band * 100) + '%';
    el.calibBand.style.width = (calib.width * 100) + '%';
    el.calib.classList.add('show');
  }
  function endCalib() {
    calib.active = false;
    calib.cooldown = rand(3.0, 5.4);
    calib.missTimer = 0;
    el.calib.classList.remove('show');
  }
  function tryCalibrate() {
    if (S.side === 'hunter') { doSwing(); return; }
    if (!calib.active) return;
    var inside = calib.pos >= calib.band && calib.pos <= calib.band + calib.width;
    var m = currentMachine();
    if (inside) {
      S.calibHits++;
      if (m) m.progress = Math.min(100, m.progress + 9);
      Sfx.good();
      addFloater(player.x, player.y, '校准成功 +9%', '#9fe3bb');
    } else {
      S.calibMiss++;
      if (m) m.progress = Math.max(0, m.progress - 5);
      Sfx.bad();
      addFloater(player.x, player.y, '校准失败 -5%', '#e2887f');
      noiseAlert(player.x, player.y, 700);
    }
    endCalib();
  }

  /* ==========================================================
     粒子 / 提示
     ========================================================== */
  function addFloater(x, y, text, color) {
    floaters.push({ x: x, y: y, text: text, color: color || '#fff', life: 1.5, max: 1.5 });
  }
  function addParticles(x, y, n, color, speed) {
    for (var i = 0; i < n; i++) {
      var a = rand(0, TAU), s = rand(speed * 0.3, speed);
      particles.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.4, 0.9), max: 0.9, color: color });
    }
  }
  function noiseAlert(x, y, radius) {
    if (!hunter) return;
    if (dist(hunter.x, hunter.y, x, y) < radius) {
      hunter.state = 'search';
      hunter.lastSeen = { x: x, y: y };
      hunter.searchTimer = 5;
      hunter.path = null; hunter.pathTimer = 0;
    }
  }
  function currentMachine() {
    if (!nearTarget || nearTarget.type !== 'machine') return null;
    return nearTarget.obj;
  }

  /* ==========================================================
     更新：玩家（第一视角移动）
     ========================================================== */
  function updatePlayer(dt) {
    if (S.side === 'hunter') { updateHunterPlayer(dt); return; }
    var ch = CHARS[S.charKey];
    var v = inputVector(dt);
    var moving = Math.abs(v.f) > 0.02 || Math.abs(v.s) > 0.02;

    var decoding = false;
    var audioMachine = null;
    player.decoding = decoding;
    updateMachineAudio(audioMachine, dt);

    if (calib.active) {
      calib.pos += calib.dir * calib.speed * dt;
      if (calib.pos >= 1) { calib.pos = 1; calib.dir = -1; }
      if (calib.pos <= 0) { calib.pos = 0; calib.dir = 1; }
      el.calibNeedle.style.left = (calib.pos * 100) + '%';
      calib.missTimer += dt;
      if (calib.missTimer > 4.4) {
        S.calibMiss++; Sfx.bad();
        addFloater(player.x, player.y, '校准错过', '#e2887f');
        noiseAlert(player.x, player.y, 700);
        endCalib();
      }
      // 破译时视角轻微抖动
      player.pitch = lerp(player.pitch, 0, dt * 2);
    }

    var speed = 0;
    if (decoding) {
      player.vx = 0; player.vy = 0; player.running = false;
      player.bob += dt * 1.6;
    } else {
      var wantRun = (!!keys['shift'] || touch.run) && player.stam > 2 && moving;
      player.running = wantRun;
      var base = 138 * player.speedMul;
      if (wantRun) base *= 1.58;
      if (player.boost > 0) base *= 1.15;
      speed = base;

      var dirX = Math.cos(player.a), dirY = Math.sin(player.a);
      var mx = (dirX * v.f - dirY * v.s) * speed;
      var my = (dirY * v.f + dirX * v.s) * speed;
      player.vx = mx; player.vy = my;

      var nx = player.x + mx * dt;
      if (!blocked(nx, player.y, player.r)) player.x = nx; else player.vx = 0;
      var ny = player.y + my * dt;
      if (!blocked(player.x, ny, player.r)) player.y = ny; else player.vy = 0;

      var spd = Math.sqrt(player.vx * player.vx + player.vy * player.vy);
      player.bob += dt * (spd / 24);
      if (spd > 20) {
        player.stepT += dt;
        var interval = wantRun ? 0.34 : 0.52;
        if (player.stepT > interval) { player.stepT = 0; Sfx.step(); }
      }
      if (wantRun) {
        player.stam = Math.max(0, player.stam - 30 * dt);
        player.stamCd = 0.7;
      }
    }
    if (!player.running) {
      if (player.stamCd > 0) player.stamCd -= dt;
      else player.stam = Math.min(100, player.stam + 22 * dt);
    }

    // 头部摆动（第一视角）
    var spdNorm = clamp(Math.sqrt(player.vx * player.vx + player.vy * player.vy) / 180, 0, 1);
    var bobAmp = 1 + spdNorm * 2.4;
    player.bobY = Math.sin(player.bob * 2) * bobAmp;
    player.bobX = Math.cos(player.bob) * bobAmp * 0.7;
    player.sway = lerp(player.sway, clamp(player.vx / 220, -1, 1) * 0.6 + clamp(player.vy / 220, -1, 1) * 0.2, dt * 3);

    if (player.invuln > 0) player.invuln -= dt;
    if (player.boost > 0) player.boost -= dt;

    // 交互检测
    nearTarget = null;
    var best = 1e9;
    machines.forEach(function (m) {
      if (m.done) return;
      var d = dist(player.x, player.y, m.x, m.y);
      if (d < FOREST_SIGHT*1.5 && d < best) { best = d; nearTarget = { type: 'machine', obj: m }; }
    });
    gates.forEach(function (g) {
      if (!g.powered) return;
      var d = dist(player.x, player.y, g.x, g.y);
      if (d < FOREST_SIGHT*1.5 && d < best) { best = d; nearTarget = { type: 'gate', obj: g }; }
    });

    // 木板交互
    nearPlank = null;
    for (var pk5 = 0; pk5 < planks.length; pk5++) {
      var pl5 = planks[pk5];
      if (pl5.down) continue;
      if (dist(player.x, player.y, pl5.x, pl5.y) < 88) { nearPlank = pl5; break; }
    }
    if (eEdge) {
      if (nearPlank) knockPlank(nearPlank);
      eEdge = false;
    }

    if (calib.active && (!nearTarget || nearTarget.type !== 'machine')) endCalib();

    // 队友救援（优先于其它交互）
    nearMate = null;
    var bestMD = 1e9;
    for (var mq = 0; mq < mates.length; mq++) {
      var mq2 = mates[mq];
      if (!mq2.down) continue;
      var mqd = dist(player.x, player.y, mq2.x, mq2.y);
      if (mqd < 100 && mqd < bestMD) { bestMD = mqd; nearMate = mq2; }
    }
    if (nearMate) {
      if (interactHeld()) {
        nearMate.rescueT += 82 * dt;
        if (nearMate.rescueT >= MATE_RES_NEED) reviveMate(nearMate, '你');
      } else if (nearMate.rescueT > 0) {
        nearMate.rescueT = Math.max(0, nearMate.rescueT - 52 * dt);
      }
      if (nearMate && nearMate.down) {
        setPrompt('按住 E 救援 ' + nearMate.name + ' —— ' + Math.round(clamp(nearMate.rescueT, 0, 100)) + '%');
      }
    } else if (nearPlank && !nearTarget) {
      setPrompt('按 E 推倒木板 —— 砸晕或挡住监管者');
    } else if (nearTarget) {
      if (nearTarget.type === 'machine') {
        var pr = Math.round(nearTarget.obj.progress);
        setPrompt(interactHeld() ? '破译中… ' + pr + '%（空格校准）' : '按住 E 破译密码机 ' + pr + '%');
      } else {
        var g2 = nearTarget.obj;
        if (g2.open) setPrompt('门已开启 —— 走进门里离开庄园');
        else setPrompt(interactHeld() ? '开门中… ' + Math.round(g2.progress) + '%' : '按住 E 开启逃生门');
      }
    } else {
      if (gateMaterialsReady()) setPrompt('修门材料已集齐 · 前往林缘大门按 E 开启');
      else setPrompt(S.journeyFinds===0?'前方树桩留有灯油 · 面朝它长按 E 搜索':'沿曲折林径探索 · 留意草缝中的隐蔽小径 · M 手绘地图');
    }

    for (var i = 0; i < gates.length; i++) {
      var gg = gates[i];
      if (gg.open && dist(player.x, player.y, gg.x, gg.y) < 52) { endGame(true); return; }
    }
  }

  /* ==========================================================
     更新：监管者
     ========================================================== */
  function hunterVisibility() {
    var dx = player.x - hunter.x, dy = player.y - hunter.y;
    var distance = Math.hypot(dx, dy);
    if (!lineClear(hunter.x, hunter.y, player.x, player.y)) return 0;
    if (distance < hunter.r + player.r + 5) return 5;
    var lit = (S.lampOn && S.fuel > 0) || fixedLightAt(player.x,player.y)>.3;
    var moving = Math.hypot(player.vx, player.vy) > 12;
    var range = lit ? DIFFS[S.diffKey].detect * 1.22 : (moving ? 80 : 46);
    if (distance > range) return 0;
    var facing = (dx * Math.cos(hunter.heading) + dy * Math.sin(hunter.heading)) / Math.max(distance, 1);
    if (!lit && facing < .72) return 0;
    if (lit) return facing > -.25 ? 3.5 : .8;
    return moving ? 1.05 : .55;
  }

  function hunterCanSee() {
    return hunterVisibility() > 0;
  }

  function pickPatrolTarget() {
    var alive = machines.filter(function (m) { return !m.done; });
    if (alive.length) {
      if (Math.random() < 0.18 && S.decoded >= 3) {
        var g = gates[randi(0, gates.length - 1)];
        return { x: g.x, y: g.y };
      }
      var m = alive[randi(0, alive.length - 1)];
      return { x: m.x + rand(-40, 40), y: m.y + rand(-40, 40) };
    }
    var g2 = gates[randi(0, gates.length - 1)];
    return { x: g2.x, y: g2.y };
  }
  function hunterPathTo(tx, ty) {
    var sx = Math.floor(hunter.x / TILE), sy = Math.floor(hunter.y / TILE);
    var gx = clamp(Math.floor(tx / TILE), 0, COLS - 1), gy = clamp(Math.floor(ty / TILE), 0, ROWS - 1);
    if (grid[gy * COLS + gx] !== 1) {
      var found = false;
      for (var r2 = 1; r2 < 6 && !found; r2++) {
        for (var dy = -r2; dy <= r2 && !found; dy++) {
          for (var dx = -r2; dx <= r2 && !found; dx++) {
            var nx = gx + dx, ny = gy + dy;
            if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;
            if (grid[ny * COLS + nx] === 1) { gx = nx; gy = ny; found = true; }
          }
        }
      }
    }
    return findPath(sx, sy, gx, gy);
  }

  /* 一台密码机破译完成（玩家与队友共用） */
  function completeMachine(mm) {
    if (mm.done) return;
    mm.done = true; mm.spark = 1; S.decoded++;
    if (Sfx.ding) Sfx.ding();
    addFloater(mm.x, mm.y, '已搜集', '#ffd78a');
    addParticles(mm.x, mm.y, 18, 'rgba(255,215,138,0.9)', 120);
    if(mm.package)S.inventory[mm.package.item]+=mm.package.need;
    if(gateMaterialsReady())toast('求生者已集齐修门材料，正在寻找大门！',3);
    // 仅当玩家正对着这台密码机校准时才收掉校准条，避免队友破译打断玩家
    if (calib.active && nearTarget && nearTarget.type === 'machine' && nearTarget.obj === mm) endCalib();
  }

  /* 队友寻路移动：沿 A* 路径逐点前进，到达返回 true */
  function mateStep(m, tx, ty, sp, dt) {
    var gx = Math.floor(tx / TILE), gy = Math.floor(ty / TILE);
    var cx = Math.floor(m.x / TILE), cy = Math.floor(m.y / TILE);
    m.pathT = (m.pathT || 0) - dt;
    var needRepath = !m.path || !m.path.length || m.pathT <= 0 ||
      !m.pathGoal || m.pathGoal.x !== gx || m.pathGoal.y !== gy;
    if (needRepath) {
      m.pathGoal = { x: gx, y: gy };
      m.path = findPath(cx, cy, gx, gy);
      m.pathT = 1.0 + Math.random() * 0.6;
      if (m.path && m.path.length) m.path.shift();
    }
    var wx, wy;
    if (m.path && m.path.length) {
      var wpt = m.path[0];
      wx = wpt.x * TILE + TILE / 2; wy = wpt.y * TILE + TILE / 2;
      if (dist(m.x, m.y, wx, wy) < 9) { m.path.shift(); return false; }
    } else {
      wx = tx; wy = ty;
    }
    var dx = wx - m.x, dy = wy - m.y;
    var dl = Math.sqrt(dx * dx + dy * dy) || 1;
    if (dl < 2.5) return true;
    var stp = Math.min(dl, sp * dt);
    var oldX = m.x, oldY = m.y;
    var nx = m.x + dx / dl * stp, ny = m.y + dy / dl * stp;
    var moved = false;
    if (!blocked(nx, m.y, m.r, true)) { m.x = nx; moved = true; }
    if (!blocked(m.x, ny, m.r, true)) { m.y = ny; moved = true; }
    var travelled = dist(oldX, oldY, m.x, m.y);
    if (travelled > 0) {
      m.moving = true;
      m.moveX = (m.x - oldX) / travelled;
      m.moveY = (m.y - oldY) / travelled;
      m.stride = (m.stride + travelled) % 60;
    }
    if (Math.abs(dx) > 1) m.face = dx > 0 ? 1 : -1;
    if (!moved) { m.path = null; m.pathT = 0; }
    return false;
  }

  /* 给队友挑一个可达的闲逛点 */
  function pickMatePoint(m) {
    for (var t = 0; t < 20; t++) {
      var rm = rooms[randi(0, rooms.length - 1)];
      var rc = roomCenter(rm);
      var px2 = (rc.x + rand(-1.8, 1.8)) * TILE;
      var py2 = (rc.y + rand(-1.4, 1.4)) * TILE;
      if (blocked(px2, py2, 14)) continue;
      return { x: px2, y: py2 };
    }
    return { x: m.x + rand(-60, 60), y: m.y + rand(-60, 60) };
  }

  function downMate(m) {
    m.down = true; m.dead = false;
    m.downT = MATE_BLEED; m.rescueT = 0; m.invuln = 0;
    m.wp = null; m.flee = 0;
    addFloater(m.x, m.y, m.name + ' 倒地！', '#ff9f92');
    addParticles(m.x, m.y, 18, 'rgba(190,52,44,0.82)', 110);
    if (Sfx.bad) Sfx.bad();
    S.danger = Math.max(S.danger, 0.8);
    S.shake = Math.max(S.shake, 6);
    toast(m.name + ' 被击倒了 —— 靠近并按住 E 救援', 3.2);
  }

  function reviveMate(m, byName) {
    m.down = false; m.dead = false;
    m.downT = 0; m.rescueT = 0; m.invuln = 4.0;
    m.wp = null; m.path = null; m.rescueT = 0;
    S.rescued = (S.rescued || 0) + 1;
    addFloater(m.x, m.y, m.name + ' 站起来了！', '#9fe8a8');
    addParticles(m.x, m.y, 20, 'rgba(150,220,160,0.8)', 105);
    if (Sfx.win) Sfx.win();
    toast((byName ? byName + ' 救起了 ' : '救援成功 —— ') + m.name, 2.4);
  }

  function updateMates(dt) {
    for (var i = 0; i < mates.length; i++) {
      var m = mates[i];
      m.moving = false;
      m.invuln = Math.max(0, m.invuln - dt);
      if (m.dead) continue;

      // 倒地：流血倒计时（可被玩家或其他队友救起）
      if (m.down) {
        m.downT -= dt;
        if (m.rescueT > 0) m.rescueT = Math.max(0, m.rescueT - 26 * dt);
        if (m.downT <= 0) {
          m.dead = true; m.down = false; m.rescueT = 0;
          toast(m.name + ' 没能撑住…', 2.8);
        }
        continue;
      }

      var dh = hunter ? dist(m.x, m.y, hunter.x, hunter.y) : 9999;
      var seesHunter = hunter && hunter.stun <= 0 && dh < 250 &&
        lineClear(m.x, m.y, hunter.x, hunter.y);

      // 1) 看见监管者：逃跑优先
      if (seesHunter) {
        var ax = m.x - hunter.x, ay = m.y - hunter.y;
        var al = Math.sqrt(ax * ax + ay * ay) || 1;
        m.task = 'flee'; m.flee = 1.8;
        m.path = null; m.decoding = 0;
        mateStep(m, m.x + ax / al * 300, m.y + ay / al * 300, MATE_SPEED * 1.55, dt);
        continue;
      }
      m.flee = Math.max(0, m.flee - dt);

      // 2) 队友互助：去救倒地的人
      var target = null, bestD = 1e9;
      for (var j2 = 0; j2 < mates.length; j2++) {
        var o = mates[j2];
        if (o === m || !o.down || o.dead) continue;
        var od = dist(m.x, m.y, o.x, o.y);
        if (od < 320 && od < bestD) { bestD = od; target = o; }
      }
      if (target) {
        m.task = 'rescue'; m.decoding = 0;
        if (bestD < 42) {
          m.path = null;
          target.rescueT += MATE_RESCUE * dt;
          m.rescueT = target.rescueT;
          addParticles(target.x, target.y, 1, 'rgba(150,220,160,0.55)', 42);
          if (target.rescueT >= MATE_RES_NEED) reviveMate(target, m.name);
        } else {
          mateStep(m, target.x, target.y, MATE_SPEED * 1.32, dt);
        }
        continue;
      }

      if (!m.wp || dist(m.x,m.y,m.wp.x,m.wp.y)<30) m.wp = pickMatePoint(m);
      mateStep(m,m.wp.x,m.wp.y,MATE_SPEED,dt);
      m.task = 'wander';
      continue;

    }
  }

  function updateMateHud() {
    if (!el.mateRow) return;
    var html = '';
    for (var i = 0; i < mates.length; i++) {
      var m = mates[i];
      var cls = 'mate', stat = '在场', bar = '';
      if (!m.dead && !m.down) {
        if (m.task === 'decode') stat = '搜集中';
        else if (m.task === 'rescue') stat = '救援中';
        else if (m.task === 'flee') stat = '逃跑中';
        else if (m.task === 'escape') stat = '逃生中';
        else stat = '巡逻中';
      }
      if (S.side === 'hunter' && !m.dead && !m.down && !m.escaped) {
        stat += ' · ' + Math.max(0, m.hp) + '血';
      }
      if (m.escaped) { cls += ' dead'; stat = '已逃脱'; }
      else if (m.dead) { cls += ' dead'; stat = '已淘汰'; }
      else if (m.down) {
        cls += ' down';
        stat = '倒地 ' + Math.ceil(Math.max(0, m.downT)) + 's';
        bar = '<i class="mbar"><b style="width:' + Math.round(clamp(m.rescueT, 0, 100)) + '%"></b></i>';
      }
      html += '<div class="' + cls + '"><span class="mname">' + m.name + '</span>' +
        '<span class="mstat">' + stat + '</span>' + bar + '</div>';
    }
    if (html !== lastMateHtml) { el.mateRow.innerHTML = html; lastMateHtml = html; }
  }

  /* ==========================================================
     监管者模式：玩家操控监管者
     ========================================================== */
  function countDead() { var n = 0; for (var i = 0; i < mates.length; i++) if (mates[i].dead) n++; return n; }
  function countEscaped() { var n = 0; for (var i = 0; i < mates.length; i++) if (mates[i].escaped) n++; return n; }
  function nearestMateDist() {
    var best = 9999;
    for (var i = 0; i < mates.length; i++) {
      var m = mates[i];
      if (m.dead || m.escaped) continue;
      var d = dist(player.x, player.y, m.x, m.y);
      if (d < best) best = d;
    }
    return best;
  }

  function checkSideEnd() {
    if (S.phase !== 'play' || S.side !== 'hunter') return;
    var dead = countDead(), esc = countEscaped();
    if (esc >= 2) { endGame(false); return; }
    if (dead >= 3) { endGame(true); return; }
    if (dead + esc >= mates.length) { endGame(dead >= 3); }
  }

  function updateHunterPlayer(dt) {
    var v = inputVector(dt);
    var moving = Math.abs(v.f) > 0.02 || Math.abs(v.s) > 0.02;
    player.decoding = false;

    if (player.stun > 0) {
      player.stun -= dt;
      if (player.stun < 0) player.stun = 0;
    }
    player.swingCd = Math.max(0, player.swingCd - dt);
    player.swing = Math.max(0, player.swing - dt);
    S.sawing = player.swing > 0 ? player.swing / player.swingTime : 0;

    var wantRun = (!!keys['shift'] || touch.run) && player.stam > 2 && moving && player.stun <= 0;
    player.running = wantRun;
    var base = 150 * player.speedMul;
    if (wantRun) base *= player.runMul;
    if (player.stun > 0) base *= 0.34;
    var dirX = Math.cos(player.a), dirY = Math.sin(player.a);
    var mx = (dirX * v.f - dirY * v.s) * base;
    var my = (dirY * v.f + dirX * v.s) * base;
    player.vx = mx; player.vy = my;

    if (moving) {
      var nx = player.x + mx * dt;
      if (!blocked(nx, player.y, player.r) && !plankBlocks(nx, player.y, player.r)) player.x = nx; else player.vx = 0;
      var ny = player.y + my * dt;
      if (!blocked(player.x, ny, player.r) && !plankBlocks(player.x, ny, player.r)) player.y = ny; else player.vy = 0;

      var spd = Math.sqrt(player.vx * player.vx + player.vy * player.vy);
      player.bob += dt * (spd / 24);
      if (spd > 20) {
        player.stepT += dt;
        var interval = wantRun ? 0.34 : 0.5;
        if (player.stepT > interval) { player.stepT = 0; Sfx.step(); }
      }
    }
    if (wantRun) {
      player.stam = Math.max(0, player.stam - 30 * dt);
      player.stamCd = 0.7;
    } else if (player.stamCd > 0) {
      player.stamCd -= dt;
    } else {
      player.stam = Math.min(100, player.stam + 22 * dt);
    }

    var spdNorm = clamp(Math.sqrt(player.vx * player.vx + player.vy * player.vy) / 190, 0, 1);
    var bobAmp = 1 + spdNorm * 2.6;
    player.bobY = Math.sin(player.bob * 2) * bobAmp;
    player.bobX = Math.cos(player.bob) * bobAmp * 0.7;
    player.sway = lerp(player.sway, clamp(player.vx / 220, -1, 1) * 0.6, dt * 3);

    if (player.invuln > 0) player.invuln -= dt;
    if (player.boost > 0) player.boost -= dt;

    // 交互：E / 空格 挥砍
    nearTarget = null; nearPlank = null; nearMate = null;
    var best = 1e9, bestPl = null;
    for (var pk = 0; pk < planks.length; pk++) {
      var pl = planks[pk];
      if (pl.down && !(pl.blockT > 0)) continue;   // 已倒下且不再封路的忽略
      var pd = dist(player.x, player.y, pl.x, pl.y);
      if (pd < 92 && pd < best) { best = pd; bestPl = pl; }
    }
    nearPlank = bestPl;
    if (eEdge) {
      eEdge = false;
      if (bestPl) smashPlank(bestPl); else doSwing();
    }
    if (S.phase !== 'play') return;

    // 提示
    var nearDown = null, ndBest = 1e9;
    for (var mq = 0; mq < mates.length; mq++) {
      var mm = mates[mq];
      if (!mm.down || mm.dead || mm.escaped) continue;
      var md = dist(player.x, player.y, mm.x, mm.y);
      if (md < 120 && md < ndBest) { ndBest = md; nearDown = mm; }
    }
    var nearAlive = null, naBest = 1e9;
    for (var mq2 = 0; mq2 < mates.length; mq2++) {
      var ma = mates[mq2];
      if (ma.dead || ma.down || ma.escaped) continue;
      var ad = dist(player.x, player.y, ma.x, ma.y);
      if (ad < TRACK_ACQUIRE && ad < naBest && lineClear(player.x,player.y,ma.x,ma.y)) { naBest = ad; nearAlive = ma; }
    }
    if (player.stun > 0) setPrompt('被木板砸中 —— 动不了了');
    else if (nearDown) setPrompt('按 E 挥砍 —— 直接淘汰 ' + nearDown.name);
    else if (nearPlank) setPrompt('按 E 劈开木板（求生者推倒的木板会挡路）');
    else if (nearAlive) setPrompt('发现 ' + nearAlive.name + ' —— 按 E 挥砍');
    else setPrompt('');
  }

  /* 监管者劈碎挡路木板 */
  function smashPlank(pl) {
    if (!pl) return;
    if (pl.down && !(pl.blockT > 0)) return;
    pl.down = true; pl.blockT = 0; pl.hitFx = 1;
    addParticles(pl.x, pl.y, 20, 'rgba(206,164,108,0.9)', 120);
    addFloater(pl.x, pl.y, '木板被劈开', '#ffd27a');
    S.shake = Math.max(S.shake, 7);
    if (Sfx.hit) Sfx.hit();
    if (player.swingCd <= 0) { player.swing = player.swingTime * 0.7; player.swingCd = 0.35; }
  }

  /* 挥砍：前方扇形的求生者受到伤害 */
  function doSwing() {
    if (!player || S.phase !== 'play' || S.side !== 'hunter') return;
    if (player.stun > 0 || player.swingCd > 0) return;
    player.swing = player.swingTime;
    player.swingCd = player.swingTime + 0.18;
    S.sawing = 1;
    if (Sfx.swing) Sfx.swing();

    var dirX = Math.cos(player.a), dirY = Math.sin(player.a);
    var hitAny = false;
    for (var i = 0; i < mates.length; i++) {
      var m = mates[i];
      if (m.dead || m.escaped) continue;
      var d = dist(player.x, player.y, m.x, m.y);
      if (d > player.reach + m.r || d < 0.001) continue;
      var vx = (m.x - player.x) / d, vy = (m.y - player.y) / d;
      if (vx * dirX + vy * dirY < 0.15) continue;
      hitAny = true;
      if (m.down) {
        m.dead = true; m.down = false; m.rescueT = 0; m.decoding = 0;
        addFloater(m.x, m.y, m.name + ' 被淘汰', '#ff9f92');
        addParticles(m.x, m.y, 20, 'rgba(190,52,44,0.85)', 120);
        toast(m.name + ' 已被淘汰', 2.2);
        if (Sfx.hit) Sfx.hit();
      } else if (m.invuln > 0) {
        addFloater(m.x, m.y, '躲开了', '#cfd6e2');
      } else {
        m.hp = (typeof m.hp === 'number' ? m.hp : 2) - 1;
        m.invuln = 0.5; m.hitFx = 1;
        S.hits++;
        S.shake = Math.max(S.shake, 8);
        addParticles(m.x, m.y, 14, 'rgba(201,60,50,0.9)', 120);
        if (Sfx.hit) Sfx.hit();
        if (m.hp <= 0) downSurvivor(m);
        else { addFloater(m.x, m.y, m.name + ' 受伤', '#ffbcae'); toast(m.name + ' 受伤 —— 再来一刀就倒地', 1.8); }
      }
    }
    if (!hitAny) addParticles(player.x + dirX * 62, player.y + dirY * 62, 8, 'rgba(180,190,205,0.32)', 70);
    checkSideEnd();
  }

  function downSurvivor(m) {
    m.down = true; m.dead = false;
    m.downT = 30; m.rescueT = 0; m.invuln = 0;
    m.wp = null; m.flee = 0; m.decoding = 0; m.path = null;
    if (Sfx.bad) Sfx.bad();
    S.shake = Math.max(S.shake, 10);
    addFloater(m.x, m.y, m.name + ' 倒地！', '#ff9f92');
    addParticles(m.x, m.y, 18, 'rgba(190,52,44,0.82)', 110);
    toast(m.name + ' 倒地 —— 靠近按 E 淘汰，或等他流血倒下', 3.2);
    S.downs++;
  }

  function reviveSurvivor(m, byName) {
    m.down = false; m.dead = false;
    m.downT = 0; m.rescueT = 0; m.invuln = 2.6;
    m.path = null; m.wp = null; m.hp = 1;
    addFloater(m.x, m.y, m.name + ' 被扶起', '#9fe8a8');
    addParticles(m.x, m.y, 18, 'rgba(150,220,160,0.8)', 100);
    toast(byName + ' 扶起了 ' + m.name, 2.2);
  }

  /* 求生者 AI（玩家扮演监管者时的对手） */
  function updateSurvivors(dt) {
    var lv = AI_LEVELS[S.aiKey] || AI_LEVELS.normal;
    for (var i = 0; i < mates.length; i++) {
      var m = mates[i];
      m.moving = false;
      m.invuln = Math.max(0, m.invuln - dt);
      if (m.hitFx > 0) m.hitFx = Math.max(0, m.hitFx - dt * 2.2);
      if (m.plankCd > 0) m.plankCd -= dt;
      if (m.dead || m.escaped) continue;

      if (m.down) {
        m.downT -= dt;
        if (m.rescueT > 0) m.rescueT = Math.max(0, m.rescueT - 26 * dt);
        if (m.downT <= 0) {
          m.dead = true; m.down = false; m.rescueT = 0;
          toast(m.name + ' 没能撑住…', 2.6);
          checkSideEnd();
          if (S.phase !== 'play') return;
        }
        continue;
      }

      var dp = dist(m.x, m.y, player.x, player.y);
      var sees = player.stun <= 0 && dp < lv.sense && lineClear(m.x, m.y, player.x, player.y);

      // 1) 逃跑：顺手推倒附近的木板砸人
      if (sees) {
        var ax = m.x - player.x, ay = m.y - player.y;
        var al = Math.sqrt(ax * ax + ay * ay) || 1;
        m.task = 'flee'; m.flee = 2.0; m.decoding = 0; m.path = null;
        if (!(m.plankCd > 0)) {
          for (var pk = 0; pk < planks.length; pk++) {
            var pl = planks[pk];
            if (pl.down) continue;
            if (dist(m.x, m.y, pl.x, pl.y) < 92 && dist(player.x, player.y, pl.x, pl.y) < 150) {
              knockPlank(pl); m.plankCd = 6; break;
            }
          }
        }
        mateStep(m, m.x + ax / al * 340, m.y + ay / al * 340, MATE_SPEED * lv.speed * 1.5, dt);
        continue;
      }
      m.flee = Math.max(0, m.flee - dt);

      // 2) 互相救援
      var target = null, bestD = 1e9;
      for (var j2 = 0; j2 < mates.length; j2++) {
        var o = mates[j2];
        if (o === m || !o.down || o.dead) continue;
        var od = dist(m.x, m.y, o.x, o.y);
        if (od < 360 && od < bestD) { bestD = od; target = o; }
      }
      if (target) {
        m.task = 'rescue'; m.decoding = 0;
        if (bestD < 44) {
          m.path = null;
          target.rescueT += MATE_RESCUE * lv.rescue * dt * 0.9;
          m.rescueT = target.rescueT;
          addParticles(target.x, target.y, 1, 'rgba(150,220,160,0.55)', 42);
          if (target.rescueT >= MATE_RES_NEED) reviveSurvivor(target, m.name);
        } else {
          mateStep(m, target.x, target.y, MATE_SPEED * lv.speed * 1.3, dt);
        }
        continue;
      }

      // 3) 密码机全开 → 去逃生门
      if (gateMaterialsReady()) {
        m.task = 'escape';
        var gg = null, gb = 1e9;
        for (var k3 = 0; k3 < gates.length; k3++) {
          var cg = gates[k3];
          var cd2 = dist(m.x, m.y, cg.x, cg.y);
          if (cd2 < gb) { gb = cd2; gg = cg; }
        }
        if (gg) {
          if (gb < 48) {
            m.path = null;
            if (!gg.open) {
              gg.progress = 100;
              if (gg.progress >= 100) { gg.open = true; if (Sfx.gate) Sfx.gate(); toast(m.name + ' 打开了逃生门！', 2.6); }
            } else {
              mateStep(m, gg.x, gg.y, MATE_SPEED * 1.2, dt);
            }
          } else {
            mateStep(m, gg.x, gg.y, MATE_SPEED * lv.speed * 1.15, dt);
          }
          if (gg.open && dist(m.x, m.y, gg.x, gg.y) < 56) {
            m.escaped = true; m.decoding = 0;
            addFloater(m.x, m.y, m.name + ' 逃脱！', '#9fe8d8');
            addParticles(m.x, m.y, 18, 'rgba(150,225,215,0.8)', 110);
            toast(m.name + ' 从逃生门逃走了！', 3);
            if (Sfx.bad) Sfx.bad();
            checkSideEnd();
            if (S.phase !== 'play') return;
          }
        }
        continue;
      }

      // 4) 破译最近的未完成密码机
      var tm = null, mb = 1e9;
      for (var k2 = 0; k2 < machines.length; k2++) {
        var mc = machines[k2];
        if (mc.done || !mc.package || S.inventory[mc.package.item]>=mc.package.need) continue;
        var md = dist(m.x, m.y, mc.x, mc.y);
        if (md < mb) { mb = md; tm = mc; }
      }
      if (tm) {
        m.task = 'decode';
        if (mb < 46) {
          m.path = null; m.decoding = 1;
          tm.progress = Math.min(100, tm.progress + MATE_DECODE * lv.decode * dt);
          tm.pulse = 1;
          if (tm.progress >= 100) completeMachine(tm);
        } else {
          m.decoding = 0;
          mateStep(m, tm.x, tm.y, MATE_SPEED * lv.speed, dt);
        }
        continue;
      }

      // 5) 闲逛
      m.task = 'wander'; m.decoding = 0;
      m.wpT = (m.wpT || 0) + dt;
      if (!m.wp || dist(m.x, m.y, m.wp.x, m.wp.y) < 30 || m.wpT > 8) {
        m.wp = pickMatePoint(m); m.wpT = 0; m.path = null;
      }
      mateStep(m, m.wp.x, m.wp.y, MATE_SPEED * lv.speed, dt);
    }
  }

  function updateHunter(dt) {
    var df = DIFFS[S.diffKey];
    hunter.walk += dt;
    hunter.attackLeft = Math.max(0, hunter.attackLeft - dt);
    hunter.glow = lerp(hunter.glow, hunter.state === 'chase' ? 1 : 0.22, dt * 3);
    hunter.lunge = Math.max(0, hunter.lunge - dt * 2.2);
    for (var pk6 = 0; pk6 < planks.length; pk6++) {
      var pl6 = planks[pk6];
      if (pl6.hitFx > 0) pl6.hitFx = Math.max(0, pl6.hitFx - dt * 1.4);
      if (pl6.down && pl6.blockT > 0) {
        pl6.blockT -= dt;
        if (pl6.blockT <= 0) {
          pl6.blockT = 0;
          addParticles(pl6.x, pl6.y, 12, 'rgba(150,112,72,0.7)', 80);
        }
      }
    }
    if (hunter.stun > 0) { hunter.stun -= dt; return; }
    if(S.time<22)return;

    var d = dist(hunter.x, hunter.y, player.x, player.y);
    var visibility = hunterVisibility();
    var audible = player.running && d < df.hearing;
    hunter.awareness = clamp(hunter.awareness + (visibility > 0 ? visibility : (audible ? 2.2 : -1.45)) * dt, 0, 1);
    var canSee = hunter.awareness >= 1 && (visibility > 0 || audible);

    // 目标：玩家与队友中，最近且可见/可听的一个
    var tgt = player, tgtX = player.x, tgtY = player.y;
    var tBest = canSee ? d : Infinity;
    for (var mt2 = 0; mt2 < mates.length; mt2++) {
      var mm2 = mates[mt2];
      if (mm2.dead || mm2.down || mm2.invuln > 0) continue;
      var md2 = dist(hunter.x, hunter.y, mm2.x, mm2.y);
      if (md2 > df.detect || md2 >= tBest) continue;
      if (!lineClear(hunter.x, hunter.y, mm2.x, mm2.y)) continue;
      tBest = md2; tgt = mm2; tgtX = mm2.x; tgtY = mm2.y;
    }

    if (S.forestAlarm && !canSee) {
      hunter.state='search';hunter.lastSeen={x:S.forestAlarm.x,y:S.forestAlarm.y};
      hunter.searchTimer=3;hunter.patrolTarget=hunter.lastSeen;
    }
    if (S.bait && dist(hunter.x,hunter.y,S.bait.x,S.bait.y)<850 && d>105) {
      tBest = Infinity;
      hunter.state = 'search';
      hunter.targetObj = null;
      hunter.lastSeen = {x:S.bait.x,y:S.bait.y};
      hunter.searchTimer = 2;
      hunter.patrolTarget = {x:S.bait.x,y:S.bait.y};
    }
    if (tBest < Infinity) {
      hunter.state = 'chase';
      hunter.targetObj = tgt;
      hunter.lastSeen = { x: tgtX, y: tgtY };
      hunter.lostTimer = 0;
    } else if (hunter.state === 'chase') {
      hunter.lostTimer += dt;
      if (hunter.lostTimer > ((S.lampOn && S.fuel > 0) ? 2.4 : 1.1)) { hunter.state = 'search'; hunter.searchTimer = 6; hunter.path = null; }
    }

    var tx, ty, speed;
    if (hunter.state === 'chase') {
      var tobj = hunter.targetObj;
      if (!tobj || tobj.dead || tobj.down) tobj = player;
      var trackingPlayer = tobj === player;
      tx = trackingPlayer && !canSee && hunter.lastSeen ? hunter.lastSeen.x : tobj.x;
      ty = trackingPlayer && !canSee && hunter.lastSeen ? hunter.lastSeen.y : tobj.y;
      speed = df.chase;
    } else if (hunter.state === 'search') {
      if (!hunter.lastSeen) { hunter.state = 'patrol'; hunter.searchTimer = 0; }
      tx = hunter.lastSeen ? hunter.lastSeen.x : hunter.x;
      ty = hunter.lastSeen ? hunter.lastSeen.y : hunter.y;
      speed = df.patrol * 1.06;
      if (dist(hunter.x, hunter.y, tx, ty) < 40) {
        hunter.searchTimer -= dt;
        if (hunter.searchTimer <= 0) { hunter.state = 'patrol'; hunter.path = null; }
        else {
          if (!hunter.patrolTarget || dist(hunter.x, hunter.y, hunter.patrolTarget.x, hunter.patrolTarget.y) < 30) {
            hunter.patrolTarget = { x: tx + rand(-120, 120), y: ty + rand(-120, 120) };
          }
          tx = hunter.patrolTarget.x; ty = hunter.patrolTarget.y;
        }
      }
    } else {
      speed = df.patrol;
      if (!hunter.patrolTarget || dist(hunter.x, hunter.y, hunter.patrolTarget.x, hunter.patrolTarget.y) < 46) {
        hunter.patrolTarget = pickPatrolTarget();
        hunter.path = null;
      }
      tx = hunter.patrolTarget.x; ty = hunter.patrolTarget.y;
    }
    speed *= 1 + Math.min(0.16, S.decoded * 0.032);

    hunter.pathTimer -= dt;
    if (hunter.pathTimer <= 0 || !hunter.path || hunter.waypoint >= hunter.path.length) {
      hunter.pathTimer = hunter.state === 'chase' ? 0.32 : 0.6;
      hunter.path = hunterPathTo(tx, ty);
      hunter.waypoint = 0;
      if (hunter.path && hunter.path.length > 1) hunter.waypoint = 1;
    }

    var mvx = 0, mvy = 0;
    if (hunter.path && hunter.waypoint < hunter.path.length) {
      var wp = hunter.path[hunter.waypoint];
      var wx = (wp.x + 0.5) * TILE, wy = (wp.y + 0.5) * TILE;
      var dd = dist(hunter.x, hunter.y, wx, wy);
      if (dd < 12) hunter.waypoint++;
      else { mvx = (wx - hunter.x) / dd; mvy = (wy - hunter.y) / dd; }
    } else {
      var dt2 = dist(hunter.x, hunter.y, tx, ty) || 1;
      mvx = (tx - hunter.x) / dt2; mvy = (ty - hunter.y) / dt2;
    }

    if (mvx || mvy) {
      hunter.heading = Math.atan2(mvy, mvx);
      var oldX = hunter.x, oldY = hunter.y;
      var nx = hunter.x + mvx * speed * dt;
      var ny = hunter.y + mvy * speed * dt;
      var moved = false;
      if (!blocked(nx, hunter.y, hunter.r - 2, true) && !plankBlocks(nx, hunter.y, hunter.r - 2)) { hunter.x = nx; moved = true; } else hunter.pathTimer = 0;
      if (!blocked(hunter.x, ny, hunter.r - 2, true) && !plankBlocks(hunter.x, ny, hunter.r - 2)) { hunter.y = ny; moved = true; } else hunter.pathTimer = 0;
      if (Math.abs(mvx) > 0.05) hunter.face = mvx > 0 ? 1 : -1;
      if (!moved) {
        hunter.stuckT += dt;
        if (hunter.stuckT > 0.5) { hunter.stuckT = 0; hunter.path = null; hunter.pathTimer = 0; }
      } else hunter.stuckT = 0;
      hunter.stepDistance += dist(oldX, oldY, hunter.x, hunter.y);
      if (hunter.stepDistance >= 60) {
        hunter.stepDistance %= 60;
        playHunterStep();
      }
    }

    var contact = dist(hunter.x, hunter.y, player.x, player.y) < hunter.r + player.r + 5;
    if (contact) hunter.awareness = 1;
    if (player.invuln <= 0 && contact && lineClear(hunter.x,hunter.y,player.x,player.y)) hitPlayer();
    for (var ma2 = 0; ma2 < mates.length; ma2++) {
      var m3 = mates[ma2];
      if (m3.dead || m3.down || m3.invuln > 0) continue;
      if (dist(hunter.x, hunter.y, m3.x, m3.y) < hunter.r + m3.r + 6) {
        hunter.attackLeft = hunter.attackTime;
        downMate(m3);
      }
    }
  }

  function hitPlayer() {
    player.hp--;
    player.invuln = 1.8;
    player.boost = 1.4;
    hunter.stun = 1.05;
    hunter.lunge = 1;
    hunter.attackLeft = hunter.attackTime;
    S.shake = 18; S.flash = 1;
    Sfx.hit(); Sfx.swing();
    addParticles(player.x, player.y, 22, 'rgba(216,72,60,0.95)', 180);
    addFloater(player.x, player.y, '-1 生命', '#ff8f88');

    if (S.charKey === 'doctor' && !player.healUsed && player.hp > 0) {
      player.healUsed = true;
      player.hp = Math.min(player.maxHp, player.hp + 1);
      toast('医生的自愈救了你一次', 2.2);
    }
    if (player.hp <= 0) endGame(false);
    else toast('被击中了！快拉开距离', 1.8);
  }

  function endGame(win) {
    S.phase = 'over';
    S.win = win;
    Sfx.stopScore();
    if (win) Sfx.win(); else Sfx.lose();
    showResult();
  }

  /* ==========================================================
     主循环
     ========================================================== */
  var lastT = 0;
  function loop(ts) {
    if (!lastT) lastT = ts;
    var dt = Math.min(0.05, (ts - lastT) / 1000);
    lastT = ts;
    S.frame++;
    if (S.phase === 'play') update(dt);
    else if (S.phase === 'menu') S.menuT += dt;
    render(dt);
    requestAnimationFrame(loop);
  }

  function updateMachineAudio(machine, dt) {
    if (S.audioMachine !== machine) {
      S.audioMachine = machine;
      S.machineClock = 0;
      S.machineBeat = 0;
    }
    if (!machine) return;
    S.machineClock -= dt;
    if (S.machineClock <= 0) {
      Sfx.machineTick(S.machineBeat);
      S.machineClock += [0.13, 0.15, 0.105, 0.24][S.machineBeat % 4];
      S.machineBeat++;
    }
  }

  function playHunterStep() {
    var dx = hunter.x - player.x, dy = hunter.y - player.y;
    var distance = Math.hypot(dx, dy);
    var level = Math.pow(clamp(1 - distance / 620, 0, 1), 1.7);
    if (level < .004) return;
    var throughWall = !lineClear(player.x, player.y, hunter.x, hunter.y);
    // The listener's right vector is perpendicular to their facing angle.
    var pan = (dy * Math.cos(player.a) - dx * Math.sin(player.a)) / Math.max(distance, 1);
    Sfx.hunterStep(pan * .94, level * (throughWall ? .48 : 1), throughWall);
  }

  function updateThreatAudio(dt) {
    var distance = hunter ? dist(player.x, player.y, hunter.x, hunter.y) : nearestMateDist();
    var strength = clamp(1 - distance / (hunter ? 400 : 320), 0, 1);
    Sfx.updateScore(dt, strength);
    if (strength === 0) {
      S.heartPhase = 1;
      return;
    }
    var interval = lerp(1.07, .34, Math.pow(strength, .88));
    S.heartPhase += dt / interval;
    if (S.heartPhase >= 1) {
      S.heartPhase %= 1;
      Sfx.heart(strength, interval);
    }
  }

  function update(dt) {
    S.time += dt;
    if (S.hintTimer > 0) {
      S.hintTimer -= dt;
      if (S.hintTimer <= 0 && el.lookHint) el.lookHint.classList.remove('show');
    }
    updatePlayer(dt);
    escapeInteract(dt);
    updateJourney(dt);
    updateForestPlaces();
    updateForestLights(dt);
    updateForestEncounters(dt);
    if (S.phase !== 'play') return;
    if (S.side === 'hunter') {
      updateSurvivors(dt);
      updateHunterIntel(dt);
      if (S.phase !== 'play') return;
    } else {
      updateHunter(dt);
      if (S.phase !== 'play') return;
      updateMates(dt);
    }
    updateMateHud();

    machines.forEach(function (m) {
      m.pulse = Math.max(0, m.pulse - dt * 2);
      m.spark = Math.max(0, m.spark - dt * 1.4);
      m.bob += dt;
    });

    updateThreatAudio(dt);
    if (hunter && hunter.state === 'chase' && Math.random() < dt * 0.22) Sfx.whisper();

    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.93; p.vy *= 0.93;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (var j = floaters.length - 1; j >= 0; j--) {
      var fl = floaters[j];
      fl.life -= dt; fl.y -= 20 * dt;

  function drawFloorCeil(dirX, dirY, planeX, planeY, horizon, shakeX) {

  function drawWalls(dirX, dirY, planeX, planeY, horizon, shakeX) {

      var texX = (wallX * TS) | 0;
      if ((side === 0 && rx > 0) || (side === 1 && ry < 0)) texX = TS - 1 - texX;
      if (texX < 0) texX = 0; else if (texX >= TS) texX = TS - 1;

      var wallLight=fixedLightAt((pxc+perp*rx)*TILE,(pyc+perp*ry)*TILE);
      var lb = Math.sqrt(Math.max(forestVisibility(perp * TILE * Math.hypot(rx,ry)),wallLight));
      lb = lb * lb;
      lb *= edgeTab[x];
      if (side === 1) lb *= 0.78;
      var lv = Math.round(lb * 31);
      if (lv > 31) lv = 31; else if (lv < 0) lv = 0;

      var tid = 0;
      if (hit && mapX >= 0 && mapY >= 0 && mapX < COLS && mapY < ROWS) tid = tileTex(mapX, mapY);
      var texLv = TEX[tid][lv];

      var texStep = TS / (bot - top);
      var texPos = (y0 - top) * texStep;
      var offBase = texX;
      for (var y = y0; y <= y1; y++) {
        var ty2 = texPos | 0;
        if (ty2 < 0) ty2 = 0; else if (ty2 > 63) ty2 = 63;
        texPos += texStep;
        var texIndex=(ty2 << 6)+offBase;
        if(boundary>=0 && !boundaryMasks[boundary][texIndex]){
          // Slats reveal the cold forest haze; the perimeter still blocks movement.
          var haze=0xff000000|(FOG_B<<16)|(FOG_G<<8)|FOG_R;
          buf[y*BW+x]=haze;
        }else buf[y * BW + x] = texLv[texIndex];
      }
    }
  }

  /* ---------------- 空气尘埃 ---------------- */
  function drawMotes(dirX, dirY, planeX, planeY, horizon) {
    if (!motes.length) return;
    var torch = player.torch * S.flick;
    var det = planeX * dirY - dirX * planeY;
    if (Math.abs(det) < 1e-6) return;
    var invDet = 1 / det;
    var t = S.time;
    var range = torch * 1.05;
    bufCtx.save();
    bufCtx.globalCompositeOperation = 'lighter';
    bufCtx.fillStyle = '#ffeccb';
    for (var i = 0; i < motes.length; i++) {
      var m = motes[i];
      var dx = m.x + Math.sin(t * m.sp + m.ph) * 7 - player.x;
      var dy = m.y + Math.cos(t * m.sp * 0.78 + m.ph) * 7 - player.y;
      if (dx > 420 || dx < -420 || dy > 420 || dy < -420) continue;
      var tX = invDet * (dirY * dx - dirX * dy);
      var tY = invDet * (-planeY * dx + planeX * dy);
      if (tY <= 30) continue;
      var dT = tY / TILE;
      if (forestVisibility(Math.hypot(dx,dy)) <= 0) continue;
      var sx = (BW / 2) * (1 + tX / tY);
      if (sx < -3 || sx > BW + 3) continue;
      var col = sx | 0;
      if (col < 0) col = 0; else if (col > BW - 1) col = BW - 1;
      if (zBuf[col] < dT - 0.04) continue;
      var sy = horizon + FOCAL * (EYE_H - (m.h + Math.sin(t * 0.7 + m.ph) * 0.06)) / dT;
      if (sy < -3 || sy > BH + 3) continue;
      var a = forestVisibility(Math.hypot(dx,dy));
      a = a * a * 0.5 * S.flick;
      if (a < 0.02) continue;
      var sz = m.sz * 26 / dT;
      if (sz < 0.7) sz = 0.7; else if (sz > 2.6) sz = 2.6;
      bufCtx.globalAlpha = a;
      bufCtx.fillRect(sx - sz / 2, sy - sz / 2, sz, sz);
    }
    bufCtx.restore();
  }

  /* ---------------- 精灵投影 ---------------- */
  function drawSprites(dirX, dirY, planeX, planeY, horizon) {
    var torch = player.torch * S.flick;
    var list = [];

    machines.forEach(function (m) {
      list.push({ img: m.done ? SPR.machineDone : SPR.machine, x: m.x, y: m.y, h: 0.92, glow: m.done ? 1 : 0.5, kind: 'machine', ref: m });
    });
    gates.forEach(function (g) {
      list.push({
        img: S.side === 'survivor' ? pixelAtlas.routes[gates.indexOf(g)%3] : (g.open ? SPR.gateOpen : (g.powered ? SPR.gateOn : SPR.gateOff)),
        x: g.x, y: g.y, h: 1.62, glow: g.open ? 1 : (g.powered ? 0.7 : 0.2), kind: 'gate', ref: g
      });
    });
    crows.forEach(function (c) {
      var bobY = Math.sin(c.s * 2) * 0.35;
      list.push({ img: SPR.crow, x: c.x, y: c.y, h: 0.34, glow: 0, kind: 'crow', yOff: 1.15 + bobY });
    });
    props.forEach(function (pr) {
      
      var img = pr.kind==='fixedLamp'?(pr.remaining>0?SPR.fixedLampOn:SPR.fixedLampOff):(SPR[pr.kind+(pr.variant||'')] || SPR[pr.kind]);
      if (!img) return;
      list.push({ img: img, x: pr.x, y: pr.y, h: pr.h, glow: pr.glow, kind: 'prop', tree:pr.kind==='forestTree', yOff: pr.yOff, searched:pr.searched, fixedLamp:pr.kind==='fixedLamp' });
    });
    mates.forEach(function (m) {
      if (m.dead || m.escaped) return;
      var fl = m.hitFx > 0 ? m.hitFx : 0;
      var sprites = SPR.survivors[m.key];
      var away = (m.x - player.x) * m.moveX + (m.y - player.y) * m.moveY > 0;
      var pose = m.moving ? 1 + Math.floor(m.stride / 15) : 0;
      var frames = away ? sprites.back : sprites.front;
      list.push({
        img: m.down ? sprites.down : frames[pose],
        x: m.x, y: m.y, h: m.down ? 0.27 : 1.02,
        glow: m.down ? 0.16 : (0.05 + fl * 0.9),
        kind: m.down ? 'mateDown' : 'mate'
      });
    });
    planks.forEach(function (pl) {
      list.push({
        img: pl.down ? SPR.plankDown : SPR.plank,
        x: pl.x, y: pl.y, h: pl.down ? 0.18 : 1.06,
        glow: pl.down ? 0 : 0.12, kind: 'plank', yOff: 0
      });
    });
    if (hunter) {
      var attackFrame = hunter.attackLeft > 0 ? Math.round(12 * (1 - hunter.attackLeft / hunter.attackTime)) : 0;
      list.push({ img: SPR.hunters[hunter.key][attackFrame], x: hunter.x, y: hunter.y,
        h: hunterArt[hunter.key].size, glow: hunter.glow, kind: 'hunter' });
    }

    // 计算投影并按距离排序（远→近）
    var arr = [];
    for (var i = 0; i < list.length; i++) {
      var s = list[i];
      var dx = s.x - player.x, dy = s.y - player.y;
      var det = planeX * dirY - dirX * planeY;
      if (Math.abs(det) < 1e-6) det = 1e-6;
      var invDet = 1 / det;
      var tX = invDet * (dirY * dx - dirX * dy);
      var tY = invDet * (-planeY * dx + planeX * dy);
      if (tY <= 10) continue;
      var dTiles = tY / TILE;
      if (forestSpriteVisibility(s) <= 0) continue;
      var screenX = (BW / 2) * (1 + tX / tY);
      if (screenX < -BW * 0.7 || screenX > BW * 1.7) continue;
      var hPx = FOCAL * s.h / dTiles;
      var wPx = hPx * (s.img.width / s.img.height);
      var bottomPx = horizon + FOCAL * (EYE_H - (s.yOff || 0)) / dTiles;
      // 遮挡：中心列
      var col = clamp(Math.round(screenX), 0, BW - 1);
      if (zBuf[col] < dTiles - 0.12) continue;
      arr.push({ s: s, d: dTiles, x: screenX, h: hPx, w: wPx, bottom: bottomPx });
    }
    arr.sort(function (a, b) { return b.d - a.d; });

    for (var k = 0; k < arr.length; k++) {
      var it = arr[k];
      var alpha = clamp(1 - it.d / (torch * 1.5), 0.04, 1);
      alpha = Math.pow(alpha, 1.25);
      // 视野外边缘也压暗
      var edge = 1 - Math.pow(Math.abs(it.x / BW * 2 - 1), 2.4) * 0.55;
      alpha = forestSpriteVisibility(it.s);
      if (it.s.kind === 'prop' && it.s.fixedLamp) alpha = alpha * (.83 + .17 * Math.sin(S.time*2.4+it.s.x*.02));
      if(!it.s.tree) alpha *= clamp(edge, .08, 1);

      bufCtx.save();
      bufCtx.globalAlpha = alpha*(it.s.searched?.62:1);
      bufCtx.imageSmoothingEnabled = false;
      var sway = it.s.kind === 'hunter' && hunter.state === 'chase' ? Math.sin(S.time * 8.5) : 0;
      var drawX = it.x - it.w / 2 + sway * it.w * .035;
      var drawY = it.bottom - it.h - Math.abs(sway) * it.h * .013;
      bufCtx.drawImage(it.s.img, drawX, drawY, it.w, it.h);
      bufCtx.restore();

      // 发光叠加（灯光 / 眼睛）
      if (alpha > .03 && it.s.glow > 0.05 && lineClear(player.x,player.y,it.s.x,it.s.y)) {
        var gKey, gRgb, gBase;
        if (it.s.kind === 'hunter') { gKey = 'hunter'; gRgb = '220,54,44'; gBase = 0.30; }
        else if (it.s.kind === 'gate') { gKey = 'gate'; gRgb = '140,215,255'; gBase = 0.26; }
        else if (it.s.kind === 'prop') { gKey = 'flame'; gRgb = '255,186,96'; gBase = 0.34; }
        else {
          var doneGlow = it.s.ref && it.s.ref.done;
          gKey = doneGlow ? 'mDone' : 'mIdle';
          gRgb = doneGlow ? '255,214,145' : '130,190,255';
          gBase = 0.24;
        }
        var gSpr = glowCache[gKey] || buildGlowSprite(gRgb, gKey);
        var glowHeight = it.s.kind === 'hunter' ? .8 : .24;
        if (it.s.kind === 'prop') glowHeight = it.s.fixedLamp ? .55 : (it.s.img === SPR.lantern ? .54 : .82);
        var gx = it.x, gy = drawY + it.h * (1 - glowHeight);
        if (it.s.kind === 'machine') {
          gx = drawX + it.w * (98 / 152);
          gy = drawY + it.h * (97 / 208);
        }
        var gr = Math.max(9, it.h * (it.s.fixedLamp ? 1.15 : (it.s.kind === 'prop' ? .72 : .34)));
        var pulse = it.s.kind === 'prop' ? .88 + .12 * Math.sin(S.time * 6 + it.s.x) : 1;
        bufCtx.save();
        bufCtx.globalCompositeOperation = 'lighter';
        bufCtx.globalAlpha = clamp(gBase * it.s.glow * alpha * pulse, 0, 1);
        bufCtx.drawImage(gSpr, gx - gr, gy - gr, gr * 2, gr * 2);
        bufCtx.restore();
      }
    }
  }

  /* ---------------- 屏幕层叠加 ---------------- */
  var mistSprite;
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  function drawGroundFog() {
    if (!mistSprite) {
      mistSprite = mkCanvas(256, 64, function (c) {
        c.scale(1, .25);
        for (var i = 0; i < 13; i++) {
          var x = 36 + hash2(i, 51) * 184, y = 80 + hash2(i, 72) * 96;
          var radius = 27 + hash2(i, 92) * 25;
          var fog = c.createRadialGradient(x, y, 0, x, y, radius);
          fog.addColorStop(0, '#8caab633');
          fog.addColorStop(.45, '#799aa51d');
          fog.addColorStop(1, 'transparent');
          c.fillStyle = fog;
          c.fillRect(x - radius, y - radius, radius * 2, radius * 2);
        }
      });
    }

    // Keep mist below the horizon and under the interaction overlays.
    var time = reduceMotion.matches ? 0 : S.time;
    ctx.save();
    ctx.globalAlpha = .26;
    for (var band = 0; band < 3; band++) {
      var drift = Math.sin(time * (.16 + band * .026) + band * 2.2);
      var x = VW * (.49 + drift * .24 - .12 * Math.sin(player.a + band));
      var y = VH * (.54 + band * .104 + drift * .018);
      var width = VW * (1.04 + band * .14);
      ctx.drawImage(mistSprite, x - width / 2, y, width, VH * (.15 + .021 * band));
    }
    ctx.restore();
  }

  function drawOverlays() {
    var scaleX = VW / BW, scaleY = VH / BH;

    drawGroundFog();
    drawDenseForestFog();

    // 提灯暖色叠加（中心）
    if (!lampSpr) buildLampSprite();
    var flick = S.flick;
    var gx = VW / 2 + player.bobX * scaleX * 0.4;
    var gy = VH * 0.56 + player.bobY * scaleY;
    var lr = Math.min(VW * .40, VH * .64);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = (hunter ? (S.lampOn && S.fuel>0 ? .145 : .015) : .06) * flick;
    ctx.drawImage(lampSpr, gx - lr, gy - lr, lr * 2, lr * 2);
    ctx.restore();

    // 每局环境色（低透明度全屏叠加）
    if (S.ambient) {
      ctx.fillStyle = S.ambient;
      ctx.fillRect(0, 0, VW, VH);
    }

    // 暗角
    ctx.drawImage(vignette, 0, 0, VW, VH);

    // 危险红晕
    if (S.danger > 0.03) {
      if (!dangerSpr) buildDangerSprite();
      var dr = Math.max(VW, VH) * 0.62;
      ctx.save();
      ctx.globalAlpha = clamp(S.danger * 0.55, 0, 0.55);
      ctx.drawImage(dangerSpr, VW / 2 - dr, VH / 2 - dr, dr * 2, dr * 2);
      ctx.restore();
    }

    // 受伤闪红
    if (S.flash > 0) {
      ctx.fillStyle = 'rgba(170,26,22,' + (0.4 * S.flash) + ')';
      ctx.fillRect(0, 0, VW, VH);
    }

    drawFloaters(scaleX, scaleY);
    drawStartledCrows();
    drawHandLight();
    drawCrosshair();
    if(lanternVisible()){
      drawEscapeLabels();
    }
    drawGrain();
  }

  function drawFloaters(scaleX, scaleY) {
    var fDirX = Math.cos(player.a), fDirY = Math.sin(player.a);
    var fPlaneX = -fDirY * PLANE_K, fPlaneY = fDirX * PLANE_K;
    var fDet = fPlaneX * fDirY - fDirX * fPlaneY;
    if (Math.abs(fDet) < 1e-6) fDet = 1e-6;
    var fInv = 1 / fDet;
    floaters.forEach(function (f) {
      var dx = f.x - player.x, dy = f.y - player.y;
      var dirX = fDirX, dirY = fDirY;
      var planeX = fPlaneX, planeY = fPlaneY;
      var invDet = fInv;
      var tX = invDet * (dirY * dx - dirX * dy);
      var tY = invDet * (-planeY * dx + planeX * dy);
      if (tY <= 20 || forestVisibility(Math.hypot(dx,dy))<=0) return;
      var screenX = VW / 2 * (1 + tX / tY);
      var dT = tY / TILE;
      var horizon = BH * 0.5 + player.pitch + player.bobY;
      var sY = (horizon + FOCAL * (EYE_H - 0.8) / dT) * scaleY;
      var a = clamp(f.life / f.max, 0, 1);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.font = '600 12.5px "Noto Sans SC",system-ui,sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(0,0,0,0.95)';
      ctx.shadowBlur = 8;
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, clamp(screenX, 40, VW - 40), clamp(sY, 60, VH - 120));
      ctx.restore();
    });
  }

  function drawHunterHand() {
    var key = S.hunterKey;
    var art = hunterArt[key];
    var t = player.swing > 0 ? clamp(1 - player.swing / player.swingTime, 0, 1) : 0;
    var pose = hunterSwingPose(key, t);
    var size = clamp(Math.min(VW, VH) / 430, .53, 2.6);
    var restX = key === 'ripper' ? .25 : .77;
    var x = VW * (restX + pose.x) + player.sway * 14;
    var y = VH * (.79 + pose.y) + player.bobY * (VH / BH) * .5;
    if (t > .24 && t < .83) {
      ctx.save();
      ctx.globalAlpha = .32 * Math.sin(Math.PI * (t - .24) / .59);
      ctx.strokeStyle = art.trail;
      ctx.lineWidth = (key === 'butcher' ? 8 : 4) * size;
      ctx.lineCap = 'round';
      var trails = key === 'ripper' ? 3 : 1;
      for (var i = 0; i < trails; i++) {
        ctx.beginPath();
        if (key === 'butcher') {
          ctx.moveTo(VW * .63, VH * .18);
          ctx.quadraticCurveTo(VW * .49, VH * .39, VW * .48, VH * .77);
        } else if (key === 'ripper') {
          ctx.moveTo(VW * .18, VH * (.7-i*.04));
          ctx.quadraticCurveTo(VW * .51, VH * (.49-i*.04), VW * .84, VH * (.31-i*.04));
        } else {
          ctx.moveTo(VW * .82, VH * .55);
          ctx.quadraticCurveTo(VW * .49, VH * .33, VW * .22, VH * .61);
        }
        ctx.stroke();
      }
      ctx.restore();
    }
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(pose.angle);
    ctx.scale(size, size);
    var sleeve = ctx.createLinearGradient(-24, 0, 33, 82);
    sleeve.addColorStop(0, art.sleeve); sleeve.addColorStop(1, art.shadow);
    hunterShape(ctx, sleeve, [[-19,9],[16,7],[36,129],[-8,146],[-30,70]], '#605462');
    hunterShape(ctx, art.metal, [[-21,8],[18,6],[21,15],[-21,19]]);
    hunterOval(ctx, key === 'ripper' ? '#51515f' : '#be9781', 0, 4, 13, 14);
    drawHunterWeapon(ctx, key);
    ctx.restore();
  }

  function drawHandLight() {
    if (S.side === 'survivor' && (!S.lampOn || S.fuel<=0)) return;
    if (S.side === 'hunter') { drawHunterHand(); return; }
    var size=Math.min(VW,VH)*.0015;
    var x=VW*.82+player.bobX*1.4,y=VH*.98+player.bobY*.6;
    ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(player.bob)*.025);
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(SPR.handLantern,-58*size,-155*size,112*size,176*size);
    ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.24*S.flick;
    if(!haloSpr)buildHaloSprite();ctx.drawImage(haloSpr,-76*size,-166*size,136*size,136*size);
    ctx.restore();
  }

  function drawCrosshair() {
    if (S.phase !== 'play') return;
    var cx = VW / 2, cy = VH / 2;
    var active = !!nearTarget;
    ctx.save();
    ctx.globalAlpha = active ? 0.95 : 0.5;
    ctx.strokeStyle = active ? 'rgba(240,217,166,0.95)' : 'rgba(230,232,236,0.75)';
    ctx.lineWidth = 1.4;
    var r = active ? 7 : 5;
    if (active) {
      ctx.beginPath(); ctx.arc(cx, cy, r + 4, 0, TAU); ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(cx - r, cy); ctx.lineTo(cx - 2, cy);
    ctx.moveTo(cx + 2, cy); ctx.lineTo(cx + r, cy);
    ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy - 2);
    ctx.moveTo(cx, cy + 2); ctx.lineTo(cx, cy + r);
    ctx.stroke();
    if (active) {
      ctx.fillStyle = 'rgba(240,217,166,0.9)';
      ctx.beginPath(); ctx.arc(cx, cy, 1.6, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  /* 屏幕边缘指示器：指向未破译密码机 / 逃生门 */
  function drawMarkers(scaleX, scaleY) {
    var targets = [];
    machines.forEach(function (m) {
      if (!m.done) targets.push({ x: m.x, y: m.y, color: '120,180,255' });
    });
    gates.forEach(function (g) {
      if (g.powered) targets.push({ x: g.x, y: g.y, color: g.open ? '170,235,255' : '150,205,255' });
    });
    if (!targets.length) return;
    // 只取最近的 3 个
    targets.sort(function (a, b) {
      return dist(player.x, player.y, a.x, a.y) - dist(player.x, player.y, b.x, b.y);
    });
    targets = targets.slice(0, 3);

    var cx = VW / 2, cy = VH / 2;
    var radius = Math.min(VW, VH) * 0.33;
    for (var i = 0; i < targets.length; i++) {
      var t = targets[i];
      var ang = Math.atan2(t.y - player.y, t.x - player.x);
      var rel = normAng(ang - player.a);
      if (Math.abs(rel) < FOV_H * 0.42) continue;   // 视野内不画
      var px = cx + Math.sin(rel) * radius * 1.5;
      px = clamp(px, 34, VW - 34);
      var pyy = cy + Math.max(0, -Math.cos(rel)) * radius * .39;
      var dTiles = dist(player.x, player.y, t.x, t.y) / TILE;
      ctx.save();
      ctx.globalAlpha = 0.55;
      ctx.translate(px, pyy);
      ctx.rotate(rel - Math.PI / 2);
      ctx.fillStyle = 'rgba(' + t.color + ',0.9)';
      ctx.beginPath();
      ctx.moveTo(7, 0); ctx.lineTo(-5, 5); ctx.lineTo(-5, -5);
      ctx.closePath(); ctx.fill();
      ctx.restore();
      ctx.save();
      ctx.globalAlpha = 0.6;
      ctx.font = '600 10px "Noto Sans SC",system-ui,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(' + t.color + ',0.95)';
      ctx.fillText(dTiles.toFixed(0) + 'm', px, pyy + 18);
      ctx.restore();
    }
  }

  function drawMinimap() {
    var compactTouch = isTouch && VH < 420;
    var size = isTouch ? (compactTouch ? 96 : 124) : clamp(Math.min(VW, VH) * .27, 134, 192);
    var mx = VW - size - (compactTouch && VW > 540 ? 177 : 17);
    var my = compactTouch ? 81 : VH - size - (isTouch ? 187 : 17);
    var scale = (size - 12) / Math.hypot(WORLD_W, WORLD_H);
    var centerX = mx + size / 2, centerY = my + size / 2;
    var angle = -player.a - Math.PI / 2;
    var cos = Math.cos(angle), sin = Math.sin(angle);

    function project(x, y) {
      var dx = (x - WORLD_W / 2) * scale, dy = (y - WORLD_H / 2) * scale;
      return { x: centerX + dx * cos - dy * sin, y: centerY + dx * sin + dy * cos };
    }

    ctx.save();
    var mapPanel = ctx.createLinearGradient(mx, my, mx + size, my + size);
    mapPanel.addColorStop(0, 'rgba(28,39,47,0.96)');
    mapPanel.addColorStop(1, 'rgba(8,13,19,0.94)');
    ctx.fillStyle = mapPanel;
    rr(ctx, mx - 7, my - 7, size + 14, size + 14, 4); ctx.fill();
    ctx.strokeStyle = 'rgba(213,181,124,0.52)';
    ctx.lineWidth = 1;
    rr(ctx, mx - 7, my - 7, size + 14, size + 14, 4); ctx.stroke();

    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.translate(centerX, centerY);
    ctx.rotate(angle);
    ctx.drawImage(mapCanvas, -WORLD_W * scale / 2, -WORLD_H * scale / 2, WORLD_W * scale, WORLD_H * scale);
    ctx.restore();

    machines.forEach(function (m) {

      else {
        ctx.fillStyle = 'rgba(120,178,255,0.95)';
        ctx.beginPath(); ctx.arc(x, y, 2.4, 0, TAU); ctx.fill();
        ctx.strokeStyle = 'rgba(120,178,255,0.45)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(x, y, 4.2, -Math.PI / 2, -Math.PI / 2 + TAU * (m.progress / 100)); ctx.stroke();

      ctx.fillStyle = g.open ? 'rgba(170,235,255,1)' : (g.powered ? 'rgba(120,200,255,0.95)' : 'rgba(104,114,128,0.8)');
      ctx.fillRect(x - 2.4, y - 3.4, 4.8, 6.8);
    });

    var marker = project(player.x, player.y);
    if (!coneSpr) buildConeSprite();

    ctx.fillStyle = '#fff3cf';
    ctx.strokeStyle = '#151a20';
    ctx.beginPath();
    ctx.moveTo(marker.x, marker.y - 6);
    ctx.lineTo(marker.x + 4.5, marker.y + 4);
    ctx.lineTo(marker.x, marker.y + 2);
    ctx.lineTo(marker.x - 4.5, marker.y + 4);
    ctx.closePath(); ctx.fill(); ctx.stroke();

    if (!hunter) {
      // 监管者模式：小地图标出所有求生者
      for (var mi = 0; mi < mates.length; mi++) {

        else if (mm.down) { ctx.fillStyle = 'rgba(232,150,54,1)'; }
        else { ctx.fillStyle = 'rgba(120,200,255,0.95)'; }
        ctx.beginPath(); ctx.arc(mx2, my2, 2.6, 0, TAU); ctx.fill();
        if (!mm.dead && !mm.down) {
          ctx.strokeStyle = 'rgba(120,200,255,0.35)';
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.arc(mx2, my2, 5, 0, TAU); ctx.stroke();
        }
      }
      ctx.restore();
      return;
    }
    var hd = dist(player.x, player.y, hunter.x, hunter.y);
    if (hd < 460 || hunter.state === 'chase') {
      var point = project(hunter.x, hunter.y), hx = point.x, hy = point.y;
      ctx.fillStyle = 'rgba(232,62,54,' + (hunter.state === 'chase' ? 1 : 0.68) + ')';

        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(hx, hy, 7 + Math.sin(performance.now() / 190) * 1.6, 0, TAU); ctx.stroke();
      }
    }
    ctx.restore();
  }

        polygon('#090f17',[[post-4,base-69],[post+2,base-81],[post+8,base-69]]);
        if (Math.abs(post-360) > 95) {
          c.strokeStyle = '#090f17'; c.lineWidth = 3;
          c.beginPath(); c.moveTo(post,base-29); c.lineTo(post+32,base-29+(post<360?-4.8:4.8)); c.stroke();
        }
      }
    }).toDataURL('image/jpeg', .88);
  }

  var coverUrl;

      button.setAttribute('aria-pressed', button.classList.contains('selected'));

  }

  function showStart() {

      '<button class=\"side' + (isH ? ' selected' : '') + '\" data-side=\"hunter\">监管者</button>' +
      '</div>';

    var leftCol, rightCol, lede;

      leftCol =
        '<div class=\"col-title\">选择监管者</div>' +
        '<div class=\"char-list\">' +
        hunterCard('butcher', S.hunterKey === 'butcher') +
        hunterCard('ripper', S.hunterKey === 'ripper') +
        hunterCard('geisha', S.hunterKey === 'geisha') +

        '<div class=\"col-title\" style=\"margin-top:16px\">求生者水平</div>' +
        '<div class=\"diff-row\">' + diffHtml + '</div>';
      rightCol =
        '<div class=\"col-title\">监管者操作</div>' +
        '<ul class=\"howto\">' +
        '<li><b>W / S</b> 前进后退，<b>A / D</b> 左右侧移</li>' +

    } else {

        '<li>有 <b>2 名队友</b>在场：他们会自己<b>破译密码机</b>，也会彼此<b>互相救援</b></li>' +

        '<li>破译时出现<b>校准</b>：指针进入亮区按 <b>空格</b>，成功加速、失误倒退并暴露位置</li>' +

    }

    if (!isH) rightCol = '<div class="expedition-help">近处一米细节清晰，数米内仍能辨认树干和小径，更远处被浓雾覆盖。熄灯后视野进一步缩小。曲折的褐色林径连接九处错落的空地，岔路和环路可用于绕行；较暗的苔痕小径通向隐藏藏匿处，搜索可能获得额外材料和灯油。唯一逃生大门位于东侧森林边缘。发现新地点会补充少量灯油，路牌提供附近补给或出口线索。林中散布灌木、腐朽树桩、锈蚀陷阱与中空倒木，面朝目标长按 E 约两秒探索：可能获得灯油、诱饵或逃生零件，也可能触发十秒警报，把追猎者引向声源。每个地点只能探索一次。草丛、树干和废墙会挡路，靠近时可能惊起乌鸦。树干会挡路并遮挡视线；熄灯躲在树后可以避开观察，奔跑仍会发出声音。目标文字只在近处出现。<br>WASD 移动，← → 转动视角，Shift 冲刺。F 开关提灯，Q 向前投声音诱饵（持续 9 秒，初始 3 枚）。<br>蓝色补给箱按住 E 搜索约 3 秒，补充灯油、诱饵及修门材料。灯油亮灯时约可用 4 分半，熄灯后停下或慢走可让巡逻者擦身经过，正面贴近会逐渐暴露，奔跑仍有声音。<br>只有林缘大门可以逃生。收集灯丝 ×2、麻绳 ×2、钉子 ×4，集齐后在大门旁按 E 开启并靠近逃脱。靠近固定油灯长按 E 一秒，消耗 20 灯油，照亮附近约 5 米，持续 60 秒；燃尽后可再次消耗灯油点亮。固定灯与提灯共用灯油，亮处也可能让监管者发现你。<br>物资与出口只在近处且无遮挡时显示，底部罗盘记录朝向和发现数量。M 打开只记录走过区域的手绘地图，展开地图时追猎仍会继续。队友会躲避和救援。Esc 暂停。</div>';
    el.sheet.innerHTML =
      '<div class="start' + (isH ? ' hunter' : '') + '">' +
      '<header class="brand">' +
      '<div class="eyebrow">雾林夜逃 · 探索逃生试玩版</div>' +

    if (!coverUrl) {
      coverUrl = mkCanvas(310,400,function(c) {

        c.fillStyle=fog;c.fillRect(0,0,310,400);

    el.sheet.style.setProperty('--manor-image', 'url("' + coverUrl + '")');
